zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 26ff66d075fa458191ad23b75aa88729
      name: Linux
    - uuid: 87aee4cb0e1343ccba619ab094961b8d
      name: Production
    - uuid: 05c84a0a453f4b44949ad9e9a614b173
      name: Template/Valcann
    - uuid: 57b7ae836ca64446ba2c296389c009b7
      name: Templates/Modules
    - uuid: fb0d0b63aabe4c4a83fb19a92cb34474
      name: Valcann
  templates:
    - uuid: f02934d76c64408787d6eff3a5aa2511
      template: 'Linux - Network interfaces Zabbix agent By Valcann'
      name: 'Linux - Network interfaces Zabbix agent By Valcann'
      description: |
        Known Issues:
        
          Description: High interface utilization trigger is removed since currently it is not possible to retrieve interface speed to determine the max bandwidth.
        
        Template tooling version used: 0.38
      groups:
        - name: Linux
        - name: Production
        - name: Template/Valcann
        - name: Templates/Modules
        - name: Valcann
      discovery_rules:
        - uuid: 2df8c2d876d0492c9197507bf22d63f6
          name: 'Network interface discovery'
          key: net.if.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFNAME}'
                value: '{$NET.IF.IFNAME.MATCHES}'
              - macro: '{#IFNAME}'
                value: '{$NET.IF.IFNAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Discovery of network interfaces.'
          item_prototypes:
            - uuid: a37a9bf54232475f8aaba0ab6ee071ea
              name: 'Interface {#IFNAME}: Inbound packets discarded'
              key: 'net.if.in["{#IFNAME}",dropped]'
              delay: 3m
              history: 7d
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: Application
                  value: 'Interface {#IFNAME}'
            - uuid: 7524add9190247469e969116ef939ed5
              name: 'Interface {#IFNAME}: Inbound packets with errors'
              key: 'net.if.in["{#IFNAME}",errors]'
              delay: 3m
              history: 7d
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: Application
                  value: 'Interface {#IFNAME}'
            - uuid: 2d5b4ee8f52945a58b8ad6d1d80b7538
              name: 'Interface {#IFNAME}: Bits received'
              key: 'net.if.in["{#IFNAME}"]'
              delay: 3m
              history: 7d
              units: bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: Application
                  value: 'Interface {#IFNAME}'
            - uuid: 7f2238dbe1544632a98bc01c79433f36
              name: 'Interface {#IFNAME}: Outbound packets discarded'
              key: 'net.if.out["{#IFNAME}",dropped]'
              delay: 3m
              history: 7d
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: Application
                  value: 'Interface {#IFNAME}'
            - uuid: d24c30e0f84247228a8bfa955458a2eb
              name: 'Interface {#IFNAME}: Outbound packets with errors'
              key: 'net.if.out["{#IFNAME}",errors]'
              delay: 3m
              history: 7d
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: Application
                  value: 'Interface {#IFNAME}'
            - uuid: 45c7c2c3cb4340ff86aafda07f6ae7b8
              name: 'Interface {#IFNAME}: Bits sent'
              key: 'net.if.out["{#IFNAME}"]'
              delay: 3m
              history: 7d
              units: bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: Application
                  value: 'Interface {#IFNAME}'
            - uuid: cfd80a2e00c64d46b20158628c15eb73
              name: 'Interface {#IFNAME}: Operational status'
              key: 'vfs.file.contents["/sys/class/net/{#IFNAME}/operstate"]'
              history: 7d
              trends: '0'
              description: |
                Indicates the interface RFC2863 operational state as a string.
                Possible values are:"unknown", "notpresent", "down", "lowerlayerdown", "testing","dormant", "up".
                Reference: https://www.kernel.org/doc/Documentation/ABI/testing/sysfs-class-net
              valuemap:
                name: 'IF-MIB::ifOperStatus'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var newvalue;
                      switch(value) {
                        case "up":
                          newvalue = 1;
                          break;
                        case "down":
                          newvalue = 2;
                          break;
                        case "testing":
                          newvalue = 4;
                          break;
                        case "unknown":
                          newvalue = 5;
                          break;
                        case "dormant":
                          newvalue = 6;
                          break;
                        case "notPresent":
                          newvalue = 7;
                          break;
                        default:
                          newvalue = "Problem parsing interface operstate in JS";
                      }
                      return newvalue;
              tags:
                - tag: Application
                  value: 'Interface {#IFNAME}'
              trigger_prototypes:
                - uuid: 012f7f8a5736408c9625a43a064f82bc
                  expression: '{$IFCONTROL:"{#IFNAME}"}=1 and (last(/Linux - Network interfaces Zabbix agent By Valcann/vfs.file.contents["/sys/class/net/{#IFNAME}/operstate"])=2 and (last(/Linux - Network interfaces Zabbix agent By Valcann/vfs.file.contents["/sys/class/net/{#IFNAME}/operstate"],#1)<>last(/Linux - Network interfaces Zabbix agent By Valcann/vfs.file.contents["/sys/class/net/{#IFNAME}/operstate"],#2))=1)'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/Linux - Network interfaces Zabbix agent By Valcann/vfs.file.contents["/sys/class/net/{#IFNAME}/operstate"])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
                  name: '[P3] {$CLIENT} | EC2 | {HOST.NAME} | PRD | INTERFACE {#IFNAME}: Link down'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: |
                    This trigger expression works as follows:
                    1. Can be triggered if operations status is down.
                    2. {$IFCONTROL:"{#IFNAME}"}=1 - user can redefine Context macro to value - 0. That marks this interface as not important. No new trigger will be fired if this interface is down.
                    3. {TEMPLATE_NAME:METRIC.diff()}=1) - trigger fires only if operational status was up(1) sometime before. (So, do not fire 'ethernal off' interfaces.)
                    
                    WARNING: if closed manually - won't fire again on next poll, because of .diff.
                  manual_close: 'YES'
            - uuid: a40c3846e12c467ebb087d7765296dc5
              name: 'Interface {#IFNAME}: Interface type'
              key: 'vfs.file.contents["/sys/class/net/{#IFNAME}/type"]'
              delay: 1h
              history: 7d
              trends: 0d
              description: |
                Indicates the interface protocol type as a decimal value.
                See include/uapi/linux/if_arp.h for all possible values.
                Reference: https://www.kernel.org/doc/Documentation/ABI/testing/sysfs-class-net
              valuemap:
                name: 'Linux::Interface protocol types'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              tags:
                - tag: Application
                  value: 'Interface {#IFNAME}'
          trigger_prototypes:
            - uuid: fec835b8a80f4e16b94ea5336de813f9
              expression: |
                change(/Linux - Network interfaces Zabbix agent By Valcann/vfs.file.contents["/sys/class/net/{#IFNAME}/type"])<0 and last(/Linux - Network interfaces Zabbix agent By Valcann/vfs.file.contents["/sys/class/net/{#IFNAME}/type"])>0
                and
                (last(/Linux - Network interfaces Zabbix agent By Valcann/vfs.file.contents["/sys/class/net/{#IFNAME}/type"])=6
                or last(/Linux - Network interfaces Zabbix agent By Valcann/vfs.file.contents["/sys/class/net/{#IFNAME}/type"])=1)
                and
                (last(/Linux - Network interfaces Zabbix agent By Valcann/vfs.file.contents["/sys/class/net/{#IFNAME}/operstate"])<>2)
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: |
                (change(/Linux - Network interfaces Zabbix agent By Valcann/vfs.file.contents["/sys/class/net/{#IFNAME}/type"])>0 and last(/Linux - Network interfaces Zabbix agent By Valcann/vfs.file.contents["/sys/class/net/{#IFNAME}/type"],#2)>0) or
                (last(/Linux - Network interfaces Zabbix agent By Valcann/vfs.file.contents["/sys/class/net/{#IFNAME}/operstate"])=2)
              name: '[P3] {$CLIENT} | EC2 | {HOST.NAME} | PRD | Interface {#IFNAME}: Ethernet has changed to lower speed than it was before'
              opdata: 'Current reported speed: {ITEM.LASTVALUE1}'
              priority: INFO
              description: 'This Ethernet connection has transitioned down from its known maximum speed. This might be a sign of autonegotiation issues. Ack to close.'
              manual_close: 'YES'
              dependencies:
                - name: '[P3] {$CLIENT} | EC2 | {HOST.NAME} | PRD | INTERFACE {#IFNAME}: Link down'
                  expression: '{$IFCONTROL:"{#IFNAME}"}=1 and (last(/Linux - Network interfaces Zabbix agent By Valcann/vfs.file.contents["/sys/class/net/{#IFNAME}/operstate"])=2 and (last(/Linux - Network interfaces Zabbix agent By Valcann/vfs.file.contents["/sys/class/net/{#IFNAME}/operstate"],#1)<>last(/Linux - Network interfaces Zabbix agent By Valcann/vfs.file.contents["/sys/class/net/{#IFNAME}/operstate"],#2))=1)'
                  recovery_expression: 'last(/Linux - Network interfaces Zabbix agent By Valcann/vfs.file.contents["/sys/class/net/{#IFNAME}/operstate"])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
            - uuid: 945ca1c8f71348e4821aa9ed28f5a437
              expression: |
                min(/Linux - Network interfaces Zabbix agent By Valcann/net.if.in["{#IFNAME}",errors],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}
                or min(/Linux - Network interfaces Zabbix agent By Valcann/net.if.out["{#IFNAME}",errors],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: |
                max(/Linux - Network interfaces Zabbix agent By Valcann/net.if.in["{#IFNAME}",errors],5m)<{$IF.ERRORS.WARN:"{#IFNAME}"}*0.8
                and max(/Linux - Network interfaces Zabbix agent By Valcann/net.if.out["{#IFNAME}",errors],5m)<{$IF.ERRORS.WARN:"{#IFNAME}"}*0.8
              name: '[P3] {$CLIENT} | EC2 | {HOST.NAME} | PRD | INTERFACE {#IFNAME}: High error rate ( > {$IF.ERRORS.WARN:"{#IFNAME}"} for 5m)'
              opdata: 'errors in: {ITEM.LASTVALUE1}, errors out: {ITEM.LASTVALUE2}'
              priority: WARNING
              description: 'Recovers when below 80% of {$IF.ERRORS.WARN:"{#IFNAME}"} threshold'
              manual_close: 'YES'
              dependencies:
                - name: '[P3] {$CLIENT} | EC2 | {HOST.NAME} | PRD | INTERFACE {#IFNAME}: Link down'
                  expression: '{$IFCONTROL:"{#IFNAME}"}=1 and (last(/Linux - Network interfaces Zabbix agent By Valcann/vfs.file.contents["/sys/class/net/{#IFNAME}/operstate"])=2 and (last(/Linux - Network interfaces Zabbix agent By Valcann/vfs.file.contents["/sys/class/net/{#IFNAME}/operstate"],#1)<>last(/Linux - Network interfaces Zabbix agent By Valcann/vfs.file.contents["/sys/class/net/{#IFNAME}/operstate"],#2))=1)'
                  recovery_expression: 'last(/Linux - Network interfaces Zabbix agent By Valcann/vfs.file.contents["/sys/class/net/{#IFNAME}/operstate"])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
          graph_prototypes:
            - uuid: db40a0d893ae4bc7a7e2b1553e2177fe
              name: 'Interface {#IFNAME}: Network traffic'
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 1A7C11
                  item:
                    host: 'Linux - Network interfaces Zabbix agent By Valcann'
                    key: 'net.if.in["{#IFNAME}"]'
                - sortorder: '1'
                  drawtype: BOLD_LINE
                  color: 2774A4
                  item:
                    host: 'Linux - Network interfaces Zabbix agent By Valcann'
                    key: 'net.if.out["{#IFNAME}"]'
                - sortorder: '2'
                  color: F63100
                  yaxisside: RIGHT
                  item:
                    host: 'Linux - Network interfaces Zabbix agent By Valcann'
                    key: 'net.if.out["{#IFNAME}",errors]'
                - sortorder: '3'
                  color: A54F10
                  yaxisside: RIGHT
                  item:
                    host: 'Linux - Network interfaces Zabbix agent By Valcann'
                    key: 'net.if.in["{#IFNAME}",errors]'
                - sortorder: '4'
                  color: FC6EA3
                  yaxisside: RIGHT
                  item:
                    host: 'Linux - Network interfaces Zabbix agent By Valcann'
                    key: 'net.if.out["{#IFNAME}",dropped]'
                - sortorder: '5'
                  color: 6C59DC
                  yaxisside: RIGHT
                  item:
                    host: 'Linux - Network interfaces Zabbix agent By Valcann'
                    key: 'net.if.in["{#IFNAME}",dropped]'
      tags:
        - tag: component
          value: network
        - tag: custom
          value: valcann
        - tag: os
          value: linux
        - tag: tier
          value: production
      macros:
        - macro: '{$IF.ERRORS.WARN}'
          value: '2'
        - macro: '{$IFCONTROL}'
          value: '1'
        - macro: '{$NET.IF.IFNAME.MATCHES}'
          value: '^.*$'
        - macro: '{$NET.IF.IFNAME.NOT_MATCHES}'
          value: '(^Software Loopback Interface|^NULL[0-9.]*$|^[Ll]o[0-9.]*$|^[Ss]ystem$|^Nu[0-9.]*$|^veth[0-9a-z]+$|docker[0-9]+|br-[a-z0-9]{12})'
          description: 'Filter out loopbacks, nulls, docker veth links and docker0 bridge by default'
      dashboards:
        - uuid: 0c42e6bda766430883c0ea8e7c42330b
          name: 'Network interfaces'
          pages:
            - widgets:
                - type: graphprototype
                  width: '72'
                  height: '5'
                  fields:
                    - type: INTEGER
                      name: columns
                      value: '1'
                    - type: GRAPH_PROTOTYPE
                      name: graphid
                      value:
                        host: 'Linux - Network interfaces Zabbix agent By Valcann'
                        name: 'Interface {#IFNAME}: Network traffic'
                    - type: STRING
                      name: reference
                      value: AAAAA
                    - type: INTEGER
                      name: rows
                      value: '1'
                    - type: INTEGER
                      name: source_type
                      value: '2'
      valuemaps:
        - uuid: 4f9835fd11eb4fdfa7b3508aa7b21a54
          name: 'IF-MIB::ifOperStatus'
          mappings:
            - value: '1'
              newvalue: up
            - value: '2'
              newvalue: down
            - value: '4'
              newvalue: unknown
            - value: '5'
              newvalue: dormant
            - value: '6'
              newvalue: notPresent
