                      expression: 'min(/Template DB Oracle ODBC Custom by Valcann/oracle.tbs_used_file_pct_total["{#TABLESPACE}"],5m)>{$ORACLE.TBS.USED.PCT.MAX.HIGH}'
                  tags:
                    - tag: Indicators
                      value: Operational
            - uuid: db427bf973564a5292f04098b9fa6576
              name: 'Oracle TBS ''{#TABLESPACE}'': Tablespace allocated, percent'
              type: DEPENDENT
              key: 'oracle.tbs_used_pct["{#TABLESPACE}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: '%'
              description: 'Allocated bytes/Max bytes*100'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.TABLESPACE==''{#TABLESPACE}'')].USED_PCT_MAX.first()'
              master_item:
                key: 'db.odbc.get[tablespace_stats,"{$ORACLE.DSN}"]'
              tags:
                - tag: Application
                  value: 'Oracle {#CONTENTS} Tablespaces. {#TABLESPACE}'
              trigger_prototypes:
