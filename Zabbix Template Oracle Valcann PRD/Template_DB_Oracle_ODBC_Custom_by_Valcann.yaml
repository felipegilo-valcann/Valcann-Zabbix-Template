  triggers:
    - uuid: c1a03e3f80a242bd8390d87a198a7aea
      expression: 'max(/Template DB Oracle ODBC Custom by Valcann/net.tcp.service[tcp,{$ORACLE.IP.CONN},{$ORACLE.PORT}],#3)=0  and max(/Template DB Oracle ODBC Custom by Valcann/proc.num[,,,"tnslsnr LISTENER"],#3)>0'
      name: '[P1] {$CLIENT} | ORACLE| {HOST.NAME} | PRD | Port {$ORACLE.PORT} is unavailable'
      priority: DISASTER
      description: 'The TCP port of the Oracle Server service is currently unavailable.'
      tags:
        - tag: Indicators
          value: Operational
    - uuid: e51f8387571b48f9b9b405d6879ad2af
      expression: 'min(/Template DB Oracle ODBC Custom by Valcann/oracle.processes_count,5m) * 100 / last(/Template DB Oracle ODBC Custom by Valcann/oracle.processes_limit) > {$ORACLE.PROCESSES.MAX.HIGH}'
      name: '[P1] {$CLIENT} | ORACLE | {HOST.NAME} | PRD | Too many active processes (over {$ORACLE.PROCESSES.MAX.HIGH}% for 5 min)'
      priority: HIGH
      description: |
        O número de processos Oracle ativos atingiu ou superou {$ORACLE.PROCESSES.MAX.HIGH}% do limite máximo      
        configurado (V$PARAMETER: processes) por pelo menos 5 minutos. Risco imediato de rejeição de novas conexões
        e falha de aplicação.
      manual_close: 'YES'
    - uuid: 495c83c3918348b7b19f1a388e014380
      expression: 'min(/Template DB Oracle ODBC Custom by Valcann/oracle.session_count,5m) * 100 / last(/Template DB Oracle ODBC Custom by Valcann/oracle.session_limit) > {$ORACLE.SESSIONS.MAX.HIGH}'
      name: '[P1] | ALARM: ABCDIS ABCDIS-VM-WINTHOR-DB | NUMERO MAXIMO DE SESSOES (over {$ORACLE.SESSIONS.MAX.HIGH}% for 5 min) WARN'
      priority: HIGH
      description: 'Active sessions are using more than {$ORACLE.SESSIONS.MAX.WARN}% of the available sessions.'
      tags:
        - tag: Indicators
          value: Operational
    - uuid: bd855bc0b1044403aed0c7f3de319906
      expression: 'min(/Template DB Oracle ODBC Custom by Valcann/oracle.session_count,5m) * 100 / last(/Template DB Oracle ODBC Custom by Valcann/oracle.session_limit) > {$ORACLE.SESSIONS.MAX.WARN}'
      name: '[P1] | ALARM: ABCDIS ABCDIS-VM-WINTHOR-DB | NUMERO MAXIMO DE SESSOES (over {$ORACLE.SESSIONS.MAX.}% for 5 min) WARN'
      priority: AVERAGE
      description: 'Active sessions are using more than {$ORACLE.SESSIONS.MAX.WARN}% of the available sessions.'
      tags:
        - tag: Indicators
          value: Operational
    - uuid: 3bb23910a8334d62b1339535b82c21c6
      expression: 'min(/Template DB Oracle ODBC Custom by Valcann/oracle.processes_count,5m) * 100 / last(/Template DB Oracle ODBC Custom by Valcann/oracle.processes_limit) > {$ORACLE.PROCESSES.MAX.WARN}'
      name: '[P2] {$CLIENT} | ORACLE | {HOST.NAME} | PRD | Too many active processes (over {$ORACLE.PROCESSES.MAX.WARN}% for 5 min)'
      priority: WARNING
      description: 'Active processes are using more than {$ORACLE.PROCESSES.MAX.WARN}% of the available number of processes.'
      tags:
        - tag: Indicators
          value: Operational
    - uuid: 46d7dabe7916479f86c0892a4e4dc6f5
      expression: 'min(/Template DB Oracle ODBC Custom by Valcann/oracle.session_count,5m) * 100 / last(/Template DB Oracle ODBC Custom by Valcann/oracle.session_limit) > {$ORACLE.SESSIONS.MAX.WARN}'
      name: '[P2] {$CLIENT} | ORACLE | {HOST.NAME} | PRD |  Too many active sessions (over {$ORACLE.SESSIONS.MAX.WARN}% for 5 min)'
      priority: WARNING
      description: 'Active sessions are using more than {$ORACLE.SESSIONS.MAX.WARN}% of the available sessions.'
    - uuid: 4b40ff701a3d4c7c88eaa905199cf79f
      expression: 'min(/Template DB Oracle ODBC Custom by Valcann/oracle.db_files_count,5m) * 100 / last(/Template DB Oracle ODBC Custom by Valcann/oracle.db_files_limit) > {$ORACLE.DB.FILE.MAX.WARN}'
      name: '[P2] {$CLIENT} | ORACLE | {HOST.NAME} | PRD | Too many database files (over {$ORACLE.DB.FILE.MAX.WARN}% for 5 min)'
      priority: WARNING
      description: 'Number of datafiles is higher than {$ORACLE.DB.FILE.MAX.WARN}% of the available datafile files limit.'
    - uuid: b447f15b6ed54e9d8b2b9b9b8da38614
      expression: 'min(/Template DB Oracle ODBC Custom by Valcann/oracle.total_pga_used,5m) * 100 / last(/Template DB Oracle ODBC Custom by Valcann/oracle.pga_target) > {$ORACLE.PGA.USE.MAX.WARN}'
