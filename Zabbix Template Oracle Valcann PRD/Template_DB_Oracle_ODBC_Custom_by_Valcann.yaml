                  priority: HIGH
                  tags:
                    - tag: Indicators
                      value: Operational
                - uuid: bbec8d207c2149b69e45be67fd67d876
                  expression: 'min(/Template DB Oracle ODBC Custom by Valcann/oracle.tbs_used_pct["{#TABLESPACE}"],5m)>{$ORACLE.TBS.USED.PCT.MAX.WARN}'
                  name: '[P2] {$CLIENT} | ORACLE | {HOST.NAME} | PRD | TBS ''{#TABLESPACE}'': Tablespace utilization Allocated is too high (over {$ORACLE.TBS.USED.PCT.MAX.WARN}% for 5m).'
                  status: DISABLED
                  discover: NO_DISCOVER
                  priority: WARNING
                  dependencies:
                    - name: '[P1] {$CLIENT} | ORACLE | {HOST.NAME} | PRD | TBS ''{#TABLESPACE}'': Tablespace utilization Allocated is too high (over {$ORACLE.TBS.UTIL.PCT.MAX.HIGH}% for 5m).'
                      expression: 'min(/Template DB Oracle ODBC Custom by Valcann/oracle.tbs_used_pct["{#TABLESPACE}"],5m)>{$ORACLE.TBS.UTIL.PCT.MAX.HIGH}'
                  tags:
                    - tag: Indicators
                      value: Operational
          graph_prototypes:
            - uuid: 41bf7e2e915140619cbe966e0ab58c68
              name: 'Oracle TBS ''{#TABLESPACE}'': Tablespace ''{#TABLESPACE}'''
              graph_items:
