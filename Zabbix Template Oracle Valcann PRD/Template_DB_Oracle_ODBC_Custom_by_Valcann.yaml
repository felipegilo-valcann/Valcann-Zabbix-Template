                  expression: 'min(/Template DB Oracle ODBC Custom by Valcann/oracle.tbs_used_pct["{#TABLESPACE}"],5m)>{$ORACLE.TBS.UTIL.PCT.MAX.HIGH}'
                  name: '[P1] {$CLIENT} | ORACLE | {HOST.NAME} | PRD | TBS ''{#TABLESPACE}'': Tablespace utilization Allocated is too high (over {$ORACLE.TBS.UTIL.PCT.MAX.HIGH}% for 5m).'
                  status: DISABLED
