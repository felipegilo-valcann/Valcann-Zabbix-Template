zabbix_export:
  version: '6.0'
  date: '2026-09-08T14:20:18Z'
  groups:
    - uuid: 748ad4d098d447d492bb935c907f652f
      name: Templates/Databases
  templates:
    - uuid: 9805e05598fa427ab4e8f8d8c242ace5
      template: 'Template DB Oracle ODBC Custom by Valcann'
      name: 'Template DB Oracle ODBC Custom by Valcann'
      description: |
        1. Create an Oracle user for monitoring.
        
        2. Set the user name and password in host macros ({$ORACLE.USER} and {$ORACLE.PASSWORD}).
          Do not forget to install the Microsoft ODBC driver on the Zabbix server or the Zabbix proxy.
          See Oracle documentation for instructions: https://www.oracle.com/database/technologies/releasenote-odbc-ic.html.
        
          Note! Credentials in the odbc.ini do not work for Oracle.
          Note! Be sure that ODBC connects to Oracle with session parameter NLS_NUMERIC_CHARACTERS= '.,' It is important for correct display float numbers in Zabbix.
        The "Service's TCP port state" item uses {HOST.CONN} and {$ORACLE.PORT} macros to check the availability of the listener.
        
        
        Template tooling version used: 0.38
      groups:
        - name: Templates/Databases
      items:
        - uuid: b49aa624cf184da79dae71770653c0d4
          name: 'Oracle: Get archive log info'
          type: ODBC
          key: 'db.odbc.get[get_archivelog_stat,"{$ORACLE.DSN}"]'
          delay: 5m
          history: '0'
          trends: '0'
          value_type: TEXT
          params: |
            SELECT
            d.dest_name, DECODE (d.status, 'VALID',3, 'DEFERRED', 2, 'ERROR', 1, 0) AS status,
            d.log_sequence,
            d.error
            FROM v$archive_dest d , v$database db
            WHERE d.status != 'INACTIVE' AND db.log_mode = 'ARCHIVELOG';
          username: '{$ORACLE.USER}'
          password: '{$ORACLE.PASSWORD}'
          tags:
            - tag: Application
              value: 'Zabbix raw items'
        - uuid: 51eb83024a504a7caa21fc8605bfa68d
          name: 'Oracle: Get ASM stats'
          type: ODBC
          key: 'db.odbc.get[get_asm_stat,"{$ORACLE.DSN}"]'
          history: '0'
          trends: '0'
          value_type: TEXT
          params: |
            SELECT
            name AS dg_name,
            ROUND(total_mb / DECODE(TYPE, 'NORMAL', 2, 'HIGH', 3, 'EXTERN', 1)*1024*1024) AS size_byte,
            ROUND(usable_file_mb*1024*1024 ) AS free_size_byte,
            ROUND(100-(usable_file_mb /(total_mb / DECODE(TYPE, 'NORMAL', 2, 'HIGH', 3, 'EXTERN', 1)))* 100, 2) AS used_percent
            FROM v$asm_diskgroup ;
          username: '{$ORACLE.USER}'
          password: '{$ORACLE.PASSWORD}'
          description: 'Get ASM disk groups stats.'
          tags:
            - tag: Application
              value: 'Zabbix raw items'
        - uuid: 93a099ff4a5a495aa344c31033864152
          name: 'Oracle: Get CDB and No-CDB info'
          type: ODBC
          key: 'db.odbc.get[get_cdb_info,"{$ORACLE.DSN}"]'
          history: '0'
          trends: '0'
          value_type: TEXT
          params: |
            SELECT name as DBNAME,
            DECODE(open_mode, 'MOUNTED', 1, 'READ ONLY', 2, 'READ WRITE', 3, 'READ ONLY WITH APPLY', 4, 'MIGRATE', 5, 0) AS open_mode,
            DECODE(database_role, 'SNAPSHOT STANDBY', 1, 'LOGICAL STANDBY', 2, 'PHYSICAL STANDBY', 3, 'PRIMARY', 4, 'FAR SYNC', 5, 0) AS ROLE,
            DECODE(force_logging, 'YES',1,'NO',0,0) AS force_logging,
            DECODE(log_mode, 'MANUAL',2 ,'ARCHIVELOG',1,'NOARCHIVELOG',0,0) AS log_mode
            FROM v$database
          username: '{$ORACLE.USER}'
          password: '{$ORACLE.PASSWORD}'
          description: 'Get info about CDB and  No-CDB databases on instansce.'
          tags:
            - tag: Application
              value: 'Zabbix raw items'
        - uuid: 8e79cf652e454e2691d04040139df3e6
          name: 'Oracle: Get instance state'
          type: ODBC
          key: 'db.odbc.get[get_instance_state,"{$ORACLE.DSN}"]'
          history: '0'
          trends: '0'
          value_type: TEXT
          params: |
            SELECT
            INSTANCE_NAME,
            HOST_NAME,
            VERSION || '-' || EDITION AS VERSION,
            floor((SYSDATE - startup_time)*60*60*24) AS UPTIME,
            decode(status,'STARTED',1,'MOUNTED',2,'OPEN',3,'OPEN MIGRATE',4, 0) AS STATUS,
            decode(archiver,'STOPPED',1,'STARTED',2,'FAILED',3, 0) AS  ARCHIVER,
            decode(instance_role,'PRIMARY_INSTANCE',1,'SECONDARY_INSTANCE',2, 0) AS  INSTANCE_ROLE
            FROM v$instance;
          username: '{$ORACLE.USER}'
          password: '{$ORACLE.PASSWORD}'
          description: 'The item gets state of the current instance.'
          tags:
            - tag: Application
              value: 'Zabbix raw items'
        - uuid: 4e790fff6d2e40cf9c037506aec321f3
          name: 'Oracle: Get PDB info'
          type: ODBC
          key: 'db.odbc.get[get_pdb_info,"{$ORACLE.DSN}"]'
          history: '0'
          trends: '0'
          value_type: TEXT
          params: |
            SELECT
            name as DBNAME,
            DECODE(open_mode, 'MOUNTED', 1, 'READ ONLY', 2, 'READ WRITE', 3, 'READ ONLY WITH APPLY', 4, 'MIGRATE', 5, 0) AS open_mode
            FROM v$pdbs;
          username: '{$ORACLE.USER}'
          password: '{$ORACLE.PASSWORD}'
          description: 'Get info about PDB databases on instansce.'
          tags:
            - tag: Application
              value: 'Zabbix raw items'
        - uuid: c9a9379abf0349239d335a5e4ed66481
          name: 'Oracle: Get system metrics (1)'
          type: ODBC
          key: 'db.odbc.get[get_system_metrics_1,"{$ORACLE.DSN}"]'
          delay: 0;m0-59
          history: '0'
          trends: '0'
          value_type: TEXT
          params: |
            SELECT 'SYS::' || METRIC_NAME AS METRIC, ROUND(VALUE,3) AS VALUE
             FROM V$SYSMETRIC WHERE GROUP_ID = 2
            UNION
              SELECT 'SYSPARAM::' || INITCAP(NAME), to_number(VALUE)
              FROM V$SYSTEM_PARAMETER WHERE NAME IN ('sessions', 'processes', 'db_files')
            UNION
             SELECT 'SESSION::Long time locked' ,count(*) FROM V$SESSION s WHERE s.BLOCKING_SESSION IS NOT NULL AND s.BLOCKING_SESSION_STATUS='VALID' AND s.SECONDS_IN_WAIT > {$ORACLE.SESSION.LOCK.MAX.TIME}
            UNION
            SELECT 'SESSION::Lock rate' ,(cnt_block / cnt_all)* 100 pct
            FROM ( SELECT COUNT(*) cnt_block FROM v$session WHERE blocking_session IS NOT NULL), ( SELECT COUNT(*) cnt_all FROM v$session)
            UNION
             SELECT 'SESSION::Total', COUNT(*) FROM V$SESSION
            UNION
            SELECT 'SESSION::' || INITCAP(STATUS)|| ' ' || INITCAP(TYPE), COUNT(*) FROM V$SESSION GROUP BY STATUS, TYPE
            UNION
            SELECT 'SESSION::Concurrency rate', NVL(ROUND(SUM(duty_act.cnt*100 / num_cores.val)), 0)
            FROM
            ( SELECT DECODE(session_state, 'ON CPU', 'CPU', wait_class) wait_class, ROUND(COUNT(*)/(60 * 15), 1) cnt
            FROM v$active_session_history sh
            WHERE sh.sample_time >= SYSDATE - 15 / 1440 AND DECODE(session_state, 'ON CPU', 'CPU', wait_class) IN('Concurrency')
            GROUP BY DECODE(session_state, 'ON CPU', 'CPU', wait_class)) duty_act,
            ( SELECT SUM(value) val FROM v$osstat WHERE stat_name = 'NUM_CPU_CORES') num_cores
            UNION
             SELECT 'PGA::' || INITCAP(NAME), VALUE FROM V$PGASTAT
             UNION
            SELECT 'PROC::Procnum', COUNT(*) FROM v$process
            UNION
            SELECT 'DATAFILE::Count', COUNT(*) FROM v$datafile;
          username: '{$ORACLE.USER}'
          password: '{$ORACLE.PASSWORD}'
          description: 'The item gets system metric values.'
          tags:
            - tag: Application
              value: 'Zabbix raw items'
        - uuid: 415a4c521c584d8b82077724b2541a3e
          name: 'Oracle: Get system metrics (2)'
          type: ODBC
          key: 'db.odbc.get[get_system_metrics_2,"{$ORACLE.DSN}"]'
          delay: 0;m0-59
          history: '0'
          trends: '0'
          status: DISABLED
          value_type: TEXT
          params: |
            SELECT 'SGA::' || INITCAP(pool) AS METRIC , SUM(bytes) AS VALUE FROM V$SGASTAT
            WHERE pool IN ( 'java pool', 'large pool' ) GROUP BY pool
            UNION
            SELECT 'SGA::Shared Pool', SUM(bytes) FROM V$SGASTAT
            WHERE pool = 'shared pool' AND name NOT IN ('library cache', 'dictionary cache', 'free memory', 'sql area')
            UNION
            SELECT 'SGA::' || INITCAP(name), bytes FROM V$SGASTAT
            WHERE pool IS NULL AND name IN ('log_buffer', 'fixed_sga')
            UNION
            SELECT 'SGA::Buffer_Cache', SUM(bytes) FROM V$SGASTAT
            WHERE pool IS NULL AND name IN ('buffer_cache', 'db_block_buffers')
            UNION
            SELECT 'REDO::Available', count(*) from v$log t where t.status in ('INACTIVE', 'UNUSED')
            UNION
            SELECT 'USER::Expire password', ROUND(DECODE(SIGN(NVL(u.expiry_date, SYSDATE + 999) - SYSDATE),-1, 0, NVL(u.expiry_date, SYSDATE + 999) - SYSDATE)) exp_passwd_days_before
            FROM dba_users u WHERE username = UPPER('{$ORACLE.USER}')
            UNION
             SELECT 'FRA::Space Limit', space_limit FROM V$RECOVERY_FILE_DEST
            UNION
             SELECT 'FRA::Space Used', space_used FROM V$RECOVERY_FILE_DEST
            UNION
             SELECT 'FRA::Space Reclaimable', space_reclaimable FROM V$RECOVERY_FILE_DEST
            UNION
             SELECT 'FRA::Number Of Files', number_of_files FROM V$RECOVERY_FILE_DEST
            UNION
             SELECT 'FRA::Usable Pct', DECODE(space_limit, 0, 0,(100-(100 *(space_used-space_reclaimable)/ space_limit))) AS VALUE FROM V$RECOVERY_FILE_DEST
            UNION
             SELECT 'FRA::Restore Point', COUNT(*) FROM V$RESTORE_POINT;
          username: '{$ORACLE.USER}'
          password: '{$ORACLE.PASSWORD}'
          description: 'The item gets system metric values.'
          tags:
            - tag: Application
              value: 'Zabbix raw items'
        - uuid: e07264c2f2a24f97b45f88ab270fafb0
          name: 'Oracle: Get tablespaces stats'
          type: ODBC
          key: 'db.odbc.get[tablespace_stats,"{$ORACLE.DSN}"]'
          history: '0'
          trends: '0'
          value_type: TEXT
          params: 'SELECT df.tablespace_name AS TABLESPACE, df.type AS TYPE, NVL(SUM(df.BYTES), 0) AS FILE_BYTES, NVL(SUM(df.MAX_BYTES), 0) AS MAX_BYTES, NVL(SUM(f.FREE), 0) AS FREE_BYTES, SUM(df.BYTES)-SUM(f.FREE) AS USED_BYTES, ROUND(DECODE(SUM(df.MAX_BYTES), 0, 0, (SUM(df.BYTES) / SUM(df.MAX_BYTES) * 100)), 2) AS USED_PCT_MAX, ROUND(DECODE(SUM(df.BYTES), 0, 0,(SUM(df.BYTES)-SUM(f.FREE))/ SUM(df.MAX_BYTES)* 100), 2) AS USED_FILE_PCT, DECODE(df.STATUS, ''ONLINE'', 1, ''OFFLINE'', 2, ''READ ONLY'', 3, 0) AS STATUS FROM ( SELECT ddf.file_id, dt.contents AS TYPE, dt.STATUS , ddf.file_name, ddf.tablespace_name, TRUNC(ddf.bytes) AS bytes, TRUNC(GREATEST(ddf.bytes, ddf.maxbytes)) AS max_bytes FROM dba_data_files ddf, dba_tablespaces dt WHERE ddf.tablespace_name = dt.tablespace_name ) df, ( SELECT TRUNC(SUM(bytes)) AS FREE, file_id FROM dba_free_space GROUP BY file_id ) f WHERE df.file_id = f.file_id (+) GROUP BY df.tablespace_name, df.TYPE, df.status UNION ALL SELECT Y.name AS TABLESPACE, Y.type AS TYPE, NVL(SUM(Y.BYTES), 0) AS FILE_BYTES, NVL(SUM(Y.MAX_BYTES), 0) AS MAX_BYTES, NVL(MAX(NVL(Y.FREE_BYTES, 0)), 0) AS FREE, SUM(Y.BYTES)-SUM(Y.FREE_BYTES) AS USED_BYTES, ROUND(DECODE(SUM(Y.MAX_BYTES), 0, 0, (SUM(Y.BYTES) / SUM(Y.MAX_BYTES) * 100)), 2) AS USED_PCT_MAX, ROUND(DECODE(SUM(Y.BYTES), 0, 0,(SUM(Y.BYTES)-SUM(Y.FREE_BYTES))/ SUM(Y.BYTES)* 100), 2) AS USED_FILE_PCT, DECODE(Y.TBS_STATUS, ''ONLINE'', 1, ''OFFLINE'', 2, ''READ ONLY'', 3, 0) AS STATUS FROM ( SELECT dtf.tablespace_name AS name, dt.contents AS TYPE, dt.STATUS AS tbs_status, dtf.status AS status, dtf.bytes AS bytes, (SELECT ((f.total_blocks - s.tot_used_blocks)* vp.value) FROM ( SELECT tablespace_name, SUM(used_blocks) tot_used_blocks FROM gv$sort_segment WHERE tablespace_name != ''DUMMY'' GROUP BY tablespace_name) s, ( SELECT tablespace_name, SUM(blocks) total_blocks FROM dba_temp_files WHERE tablespace_name != ''DUMMY'' GROUP BY tablespace_name) f, ( SELECT value FROM v$parameter WHERE name = ''db_block_size'') vp WHERE f.tablespace_name = s.tablespace_name AND f.tablespace_name = dtf.tablespace_name ) AS free_bytes, CASE WHEN dtf.maxbytes = 0 THEN dtf.bytes ELSE dtf.maxbytes END AS max_bytes FROM sys.dba_temp_files dtf, sys.dba_tablespaces dt WHERE dtf.tablespace_name = dt.tablespace_name ) Y GROUP BY Y.name, Y.TYPE, Y.tbs_status'
          username: '{$ORACLE.USER}'
          password: '{$ORACLE.PASSWORD}'
          description: |
            Get tablespaces stats.
            
            AJUSTE NA LINHA 8 COLUNA 75 
            
            df.BYTES To df.MAX_BYTES
          tags:
            - tag: Application
              value: 'Zabbix raw items'
        - uuid: f0b2f7399fea43768e27c9086278935b
          name: 'Oracle: Get tablespaces status total'
          type: ODBC
          key: 'db.odbc.get[tablespace_status,"{$ORACLE.DSN}"]'
          history: '0'
          trends: '0'
          value_type: TEXT
          params: |
            SELECT tbm.TABLESPACE_NAME AS TABLESPACE, 
               tbm.USED_PERCENT AS USED_FILE_PCT
            FROM dba_tablespace_usage_metrics tbm
               join dba_tablespaces tb on tb.TABLESPACE_NAME = tbm.TABLESPACE_NAME;
          username: '{$ORACLE.USER}'
          password: '{$ORACLE.PASSWORD}'
          description: 'Get tablespaces stats.'
          tags:
            - tag: Application
              value: 'Zabbix raw items'
        - uuid: bf25795faaf34ce4b6df8efbb1b6b353
          name: 'RMAN: Falhas de backup DB FULL'
          type: ODBC
          key: 'db.odbc.select[rman.full.failures,"{$ORACLE.DSN}"]'
          params: |
            SELECT COUNT(*)
            FROM V$RMAN_BACKUP_JOB_DETAILS
            WHERE INPUT_TYPE = 'DB FULL'
              AND START_TIME >= SYSDATE - 1.05
              AND STATUS != 'COMPLETED'
          username: '{$ORACLE.USER}'
          password: '{$ORACLE.PASSWORD}'
          triggers:
            - uuid: 6117296b3f2949f38307635e8ab369bc
              expression: 'last(/Template DB Oracle ODBC Custom by Valcann/db.odbc.select[rman.full.failures,"{$ORACLE.DSN}"])>=1'
              name: '[P1] {$CLIENT} | ORACLE | {HOST.NAME} | PRD | RMAN: Falha no backup DB FULL detectada em {HOST.NAME}'
              priority: HIGH
              description: 'Backup DB FULL falhou ou não completou nas últimas 25 horas. Verificar V$RMAN_BACKUP_JOB_DETAILS.'
        - uuid: 8eebe2c851ac478799e2472688cb1f6f
          name: 'Oracle: Service''s TCP port state'
          type: SIMPLE
          key: 'net.tcp.service[tcp,{$ORACLE.IP.CONN},{$ORACLE.PORT}]'
          delay: 30s
          history: 7d
          description: 'Test the availability of Oracle on TCP port.'
          valuemap:
            name: 'Service state'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 10m
          tags:
            - tag: Application
              value: Oracle
        - uuid: b36276dd5e58418f8ba511dfdacf7dce
          name: 'Oracle: Active parallel sessions'
          type: DEPENDENT
          key: oracle.active_parallel_sessions
          delay: '0'
          history: 7d
          value_type: FLOAT
          description: 'The number of active parallel sessions.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[?(@.METRIC==''SYS::Active Parallel Sessions'')].VALUE.first()'
          master_item:
            key: 'db.odbc.get[get_system_metrics_1,"{$ORACLE.DSN}"]'
          tags:
            - tag: Application
              value: Oracle
        - uuid: 60c5473d53db43a0a31f77978fcdd8cf
          name: 'Oracle: Active serial sessions'
          type: DEPENDENT
          key: oracle.active_serial_sessions
          delay: '0'
          history: 7d
          value_type: FLOAT
          description: 'The number of active serial sessions.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[?(@.METRIC==''SYS::Active Serial Sessions'')].VALUE.first()'
          master_item:
            key: 'db.odbc.get[get_system_metrics_1,"{$ORACLE.DSN}"]'
          tags:
            - tag: Application
              value: Oracle
        - uuid: a4e05bebf0f949798bddba8f6eff4f97
          name: 'Oracle: Average active sessions'
          type: DEPENDENT
          key: oracle.active_sessions
          delay: '0'
          history: 7d
          value_type: FLOAT
          description: 'The average active sessions at a point in time. It is the number of sessions that are either working or waiting.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[?(@.METRIC==''SYS::Average Active Sessions'')].VALUE.first()'
          master_item:
            key: 'db.odbc.get[get_system_metrics_1,"{$ORACLE.DSN}"]'
          tags:
            - tag: Application
              value: Oracle
        - uuid: bc022d031fa340e4961d56fc1feeb9b5
          name: 'Oracle: Archiver state'
          type: DEPENDENT
          key: oracle.archiver_state
          delay: '0'
          history: 7d
          status: DISABLED
          description: 'Automatic archiving status.'
          valuemap:
            name: 'Oracle archiver state'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $..ARCHIVER.first()
          master_item:
            key: 'db.odbc.get[get_instance_state,"{$ORACLE.DSN}"]'
          tags:
            - tag: Application
              value: Oracle
          triggers:
            - uuid: f9d24e21f2a74a968d531e0673e8d72e
              expression: 'last(/Template DB Oracle ODBC Custom by Valcann/oracle.archiver_state)<>2 and last(/Template DB Oracle ODBC Custom by Valcann/oracle.archiver_state)>0'
              name: '[P1] {$CLIENT} | ORACLE | {HOST.NAME} | PRD | Archiver is stopped or failed (state: {ITEM.VALUE})'
              priority: HIGH
              description: 'Oracle archiver not in Started state. In ARCHIVELOG mode, database will stall when REDO logs fill up.'
        - uuid: 29cfa3ba7daf48fbb08d856c7f16b796
          name: 'Oracle: Buffer cache hit ratio'
          type: DEPENDENT
          key: oracle.buffer_cache_hit_ratio
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'Ratio of buffer cache hits. (LogRead - PhyRead)/LogRead'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[?(@.METRIC==''SYS::Buffer Cache Hit Ratio'')].VALUE.first()'
          master_item:
            key: 'db.odbc.get[get_system_metrics_1,"{$ORACLE.DSN}"]'
          tags:
            - tag: Application
              value: Oracle
          triggers:
            - uuid: 2344cec4970c4ff5b55cc4f40858fac1
              expression: 'min(/Template DB Oracle ODBC Custom by Valcann/oracle.buffer_cache_hit_ratio,5m)<{$ORACLE.BUFFER.CACHE.HIT.MIN.WARN}'
              name: '[P2] {$CLIENT} | ORACLE | {HOST.NAME} | PRD |  Buffer cache hit ratio too low (under {$ORACLE.BUFFER.CACHE.HIT.MIN.WARN}% for 5m)'
              priority: WARNING
              description: 'Buffer cache hit ratio below threshold. Oracle performing excessive physical I/O — check missing indexes or insufficient SGA.'
        - uuid: ddbd38c5e7b349adb754d691361d77a0
          name: 'Oracle: Global cache blocks corrupted'
          type: DEPENDENT
          key: oracle.cache_blocks_corrupt
          delay: '0'
          history: 7d
          description: 'The number of blocks that encountered a corruption or checksum failure during interconnect.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[?(@.METRIC==''SYS::Global Cache Blocks Corrupted'')].VALUE.first()'
          master_item:
            key: 'db.odbc.get[get_system_metrics_1,"{$ORACLE.DSN}"]'
          tags:
            - tag: Application
              value: Oracle
        - uuid: 5de6674da34d4e3c9ecd2ae23ff00918
          name: 'Oracle: Global cache blocks lost'
          type: DEPENDENT
          key: oracle.cache_blocks_lost
          delay: '0'
          history: 7d
          description: 'The number of global cache blocks lost'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[?(@.METRIC==''SYS::Global Cache Blocks Lost'')].VALUE.first()'
          master_item:
            key: 'db.odbc.get[get_system_metrics_1,"{$ORACLE.DSN}"]'
          tags:
            - tag: Application
              value: Oracle
        - uuid: 6da4a506b2194c388157bfe4c83d2d3c
          name: 'Oracle: Cursor cache hit ratio'
          type: DEPENDENT
          key: oracle.cursor_cache_hit_ratio
          delay: '0'
          history: 7d
          status: DISABLED
          value_type: FLOAT
          units: '%'
          description: 'Ratio of cursor cache hits. CursorCacheHit/SoftParse'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[?(@.METRIC==''SYS::Cursor Cache Hit Ratio'')].VALUE.first()'
          master_item:
            key: 'db.odbc.get[get_system_metrics_1,"{$ORACLE.DSN}"]'
          tags:
            - tag: Application
              value: Oracle
          triggers:
            - uuid: 51480ca6717f44f080c901519f1fcf81
              expression: 'min(/Template DB Oracle ODBC Custom by Valcann/oracle.cursor_cache_hit_ratio,5m)<{$ORACLE.CURSOR.CACHE.HIT.MIN.WARN}'
              name: '[P2] {$CLIENT} | ORACLE | {HOST.NAME} | PRD | Cursor cache hit ratio too low (under {$ORACLE.CURSOR.CACHE.HIT.MIN.WARN}% for 5m)'
              priority: WARNING
              description: 'Cursors not being reused — missing bind variables suspected. Causes hard parse pressure on CPU and shared pool.'
        - uuid: dbbc9910a8f242059eded4e35806943e
          name: 'Oracle: Database CPU time ratio'
          type: DEPENDENT
          key: oracle.database_cpu_time_ratio
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'Calculated by dividing the total CPU used by the database by the Oracle time model statistic DB time.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[?(@.METRIC==''SYS::Database CPU Time Ratio'')].VALUE.first()'
          master_item:
            key: 'db.odbc.get[get_system_metrics_1,"{$ORACLE.DSN}"]'
          tags:
            - tag: Application
              value: Oracle
        - uuid: bb66ce8121db46bea8bfe3f635039a6d
          name: 'Oracle: Database wait time ratio'
          type: DEPENDENT
          key: oracle.database_wait_time_ratio
          delay: '0'
          history: 7d
          status: DISABLED
          value_type: FLOAT
          units: '%'
          description: 'Wait time: the time that the server process spends waiting for available shared resources (to be released by other server processes) such as latches, locks, data buffers, and so on'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[?(@.METRIC==''SYS::Database Wait Time Ratio'')].VALUE.first()'
          master_item:
            key: 'db.odbc.get[get_system_metrics_1,"{$ORACLE.DSN}"]'
          tags:
            - tag: Application
              value: Oracle
          triggers:
            - uuid: 27bdf02472aa4e9b9121d074b4430c67
              expression: 'min(/Template DB Oracle ODBC Custom by Valcann/oracle.database_wait_time_ratio,5m)>{$ORACLE.DB.WAIT.TIME.MAX.WARN}'
