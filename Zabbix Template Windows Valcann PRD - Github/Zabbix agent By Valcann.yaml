zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 87aee4cb0e1343ccba619ab094961b8d
      name: Production
    - uuid: 139f5516036449dfb4937993b38c8e6e
      name: Template/Valcann
    - uuid: 57b7ae836ca64446ba2c296389c009b7
      name: Templates/Modules
    - uuid: 5eaaad360f814208b4123886b87455e2
      name: Valcann
  templates:
    - uuid: f35b59dbc2734d53ba223323ae31b6f8
      template: 'Zabbix agent By Valcann'
      name: 'Zabbix agent By Valcann'
      description: |
        Use this template for agents reachable from Zabbix server/proxy (passive mode).
        
        Template tooling version used: 0.38
        
        By Valcann
      groups:
        - name: Production
        - name: Template/Valcann
        - name: Templates/Modules
        - name: Valcann
      items:
        - uuid: 2efc203b5a4e4bdb88f8885f4b580a3d
          name: 'Host name of Zabbix agent running'
          key: agent.hostname
          delay: 1h
          history: 7d
          value_type: CHAR
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: Application
              value: 'Monitoring agent'
        - uuid: a961b7df48c24183a438eac75d9501fd
          name: 'Zabbix agent ping'
          key: agent.ping
          history: 7d
          description: 'The agent always returns 1 for this item. It could be used in combination with nodata() for availability check.'
          valuemap:
            name: 'Zabbix agent ping status'
          tags:
            - tag: Application
              value: 'Monitoring agent'
        - uuid: 07adb5d642b24d5093cab732823ecb05
          name: 'Version of Zabbix agent running'
          key: agent.version
          delay: 1h
          history: 7d
          value_type: CHAR
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: Application
              value: 'Monitoring agent'
        - uuid: fe31b65f067a472093ee7d7958186845
          name: 'Zabbix agent availability'
          type: INTERNAL
          key: 'zabbix[host,agent,available]'
          history: 7d
          description: 'Monitoring agent availability status'
          valuemap:
            name: zabbix.host.available
          tags:
            - tag: Application
              value: Status
            - tag: Inventory
              value: 'Yes'
          triggers:
            - uuid: e268870680e14630b50070b376904193
              expression: 'max(/Zabbix agent By Valcann/zabbix[host,agent,available],{$AGENT.TIMEOUT})=0'
              name: '[P1] {$CLIENT} | EC2 | {HOST.NAME} | PRD | STATUS-CHECK (FOR {$AGENT.TIMEOUT})'
              priority: HIGH
              description: 'For passive only agents, host availability is used with {$AGENT.TIMEOUT} as time threshold.'
              manual_close: 'YES'
              tags:
                - tag: Host
                  value: '{HOST.NAME}'
                - tag: Indicators
                  value: P1
      tags:
        - tag: component
          value: agent
        - tag: customer
          value: '{$CLIENT}'
        - tag: tier
          value: production
      macros:
        - macro: '{$AGENT.TIMEOUT}'
          value: 10m
          description: 'Timeout after which agent is considered unavailable. Works only for agents reachable from Zabbix server/proxy (passive mode).'
      dashboards:
        - uuid: e622e12a869b4e26bfa21a16b4d11e0f
          name: 'Zabbix agent: Overview'
          pages:
            - name: Main
              widgets:
                - type: item
                  name: 'Agent availability'
                  width: '18'
                  height: '3'
                  fields:
                    - type: ITEM
                      name: itemid
                      value:
                        host: 'Zabbix agent By Valcann'
                        key: agent.ping
                    - type: INTEGER
                      name: show
                      value: '2'
                    - type: INTEGER
                      name: show
                      value: '4'
                - type: item
                  name: Version
                  x: '18'
                  width: '18'
                  height: '3'
                  fields:
                    - type: ITEM
                      name: itemid
                      value:
                        host: 'Zabbix agent By Valcann'
                        key: agent.version
                    - type: INTEGER
                      name: show
                      value: '2'
                    - type: INTEGER
                      name: show
                      value: '4'
                - type: graph
                  x: '36'
                  width: '36'
                  height: '5'
                  fields:
                    - type: ITEM
                      name: itemid
                      value:
                        host: 'Zabbix agent By Valcann'
                        key: agent.ping
                    - type: STRING
                      name: reference
                      value: AAAAA
                    - type: INTEGER
                      name: source_type
                      value: '1'
      valuemaps:
        - uuid: 1f7b2243ffb14435b9ac8ac7125613dc
          name: zabbix.host.available
          mappings:
            - value: '0'
              newvalue: 'not available'
            - value: '1'
              newvalue: available
            - value: '2'
              newvalue: unknown
        - uuid: 97f06e29290f4fe2b223511289281559
          name: 'Zabbix agent ping status'
          mappings:
            - value: '1'
              newvalue: Up
