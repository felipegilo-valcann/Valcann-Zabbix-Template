zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 87aee4cb0e1343ccba619ab094961b8d
      name: Production
    - uuid: 139f5516036449dfb4937993b38c8e6e
      name: Template/Valcann
    - uuid: 57b7ae836ca64446ba2c296389c009b7
      name: Templates/Modules
    - uuid: 5eaaad360f814208b4123886b87455e2
      name: Valcann
    - uuid: e6038d56379f469a8610699f874881f7
      name: Windows
  templates:
    - uuid: 624af522910045308fb59787ae9f22dd
      template: 'Windows - Filesystems Zabbix agent By Valcann'
      name: 'Windows - Filesystems Zabbix agent By Valcann'
      description: |
        Template tooling version used: 0.38
        
        By Valcann
      groups:
        - name: Production
        - name: Template/Valcann
        - name: Templates/Modules
        - name: Valcann
        - name: Windows
      discovery_rules:
        - uuid: f9f4c6b46b254caebfb32468d0eaf091
          name: 'Mounted filesystem discovery'
          key: vfs.fs.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#FSDRIVETYPE}'
                value: '{$VFS.FS.FSDRIVETYPE.MATCHES}'
              - macro: '{#FSDRIVETYPE}'
                value: '{$VFS.FS.FSDRIVETYPE.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#FSNAME}'
                value: '{$VFS.FS.FSNAME.MATCHES}'
              - macro: '{#FSNAME}'
                value: '{$VFS.FS.FSNAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#FSTYPE}'
                value: '{$VFS.FS.FSTYPE.MATCHES}'
              - macro: '{#FSTYPE}'
                value: '{$VFS.FS.FSTYPE.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Discovery of file systems of different types.'
          item_prototypes:
            - uuid: b50f0953a28e4314a2d7d820d4106304
              name: '{#FSNAME}: Space utilization'
              key: 'vfs.fs.size[{#FSNAME},pused]'
              history: 7d
              value_type: FLOAT
              units: '%'
              description: 'Space utilization in % for {#FSNAME}'
              tags:
                - tag: Application
                  value: 'Filesystem {#FSNAME}'
              trigger_prototypes:
                - uuid: 5598518904ce4e17bd9bf02df8f11053
                  expression: 'last(/Windows - Filesystems Zabbix agent By Valcann/vfs.fs.size[{#FSNAME},pused])>={$FS.PUSED.CRIT.P1}'
                  name: '[P1]{$CLIENT} | EC2 | {HOST.NAME} | {$AMBIENTE} | DISK {#FSNAME} USED 99%)'
                  opdata: 'Space used: {ITEM.LASTVALUE3} of {ITEM.LASTVALUE2} ({ITEM.LASTVALUE1})'
                  priority: HIGH
                  description: 'Disk space usage on {#FSNAME} has reached 99% or above. Only 1% of free space remaining.'
                  manual_close: 'YES'
                  tags:
                    - tag: customer
                      value: '{$CLIENT}'
                    - tag: Indicators
                      value: Operational
                - uuid: a6353d6b63054e2eac8c51ff67bd918e
                  expression: |
                    last(/Windows - Filesystems Zabbix agent By Valcann/vfs.fs.size[{#FSNAME},pused])>={$FS.PUSED.CRIT.P2}
                    and
                    last(/Windows - Filesystems Zabbix agent By Valcann/vfs.fs.size[{#FSNAME},pused])<{$FS.PUSED.CRIT.P1}
                  name: '[P2] {$CLIENT} | EC2 | {HOST.NAME} | {$AMBIENTE} | DISK {#FSNAME} USED 95%)'
                  opdata: 'Space used: {ITEM.LASTVALUE3} of {ITEM.LASTVALUE2} ({ITEM.LASTVALUE1})'
                  priority: AVERAGE
                  description: 'Disk space usage on {#FSNAME} has reached 95% or above. Only 5% of free space remaining.'
                  manual_close: 'YES'
                  tags:
                    - tag: customer
                      value: '{$CLIENT}'
                    - tag: Indicators
                      value: Operational
                - uuid: d11426ed857d404faac9a69adb2a4e61
                  expression: |
                    last(/Windows - Filesystems Zabbix agent By Valcann/vfs.fs.size[{#FSNAME},pused])>={$FS.PUSED.CRIT.P3}
                    and
                    last(/Windows - Filesystems Zabbix agent By Valcann/vfs.fs.size[{#FSNAME},pused])<{$FS.PUSED.CRIT.P2}
                  name: '[P3] {$CLIENT} | EC2 | {HOST.NAME} | {$AMBIENTE} | DISK {#FSNAME} USED 90%)'
                  opdata: 'Space used: {ITEM.LASTVALUE3} of {ITEM.LASTVALUE2} ({ITEM.LASTVALUE1})'
                  priority: WARNING
                  description: 'Disk space usage on {#FSNAME} has reached 90% or above. Only 10% of free space remaining.'
                  manual_close: 'YES'
                  tags:
                    - tag: customer
                      value: '{$CLIENT}'
                    - tag: Indicators
                      value: Operational
            - uuid: 1d740c28743a4e1b836a7cb45f7bdbf5
              name: '{#FSNAME}: Total space'
              key: 'vfs.fs.size[{#FSNAME},total]'
              history: 7d
              units: B
              description: 'Total space in Bytes'
              tags:
                - tag: Application
                  value: 'Filesystem {#FSNAME}'
            - uuid: de26506114d94ee4815b0e00bfb04551
              name: '{#FSNAME}: Used space'
              key: 'vfs.fs.size[{#FSNAME},used]'
              history: 7d
              units: B
              description: 'Used storage in Bytes'
              tags:
                - tag: Application
                  value: 'Filesystem {#FSNAME}'
          trigger_prototypes:
            - uuid: 1ab13e527c2f46e9802a2a7d24d446a0
              expression: |
                last(/Windows - Filesystems Zabbix agent By Valcann/vfs.fs.size[{#FSNAME},pused])>{$VFS.FS.PUSED.MAX.CRIT:"{#FSNAME}"} and
                ((last(/Windows - Filesystems Zabbix agent By Valcann/vfs.fs.size[{#FSNAME},total])-last(/Windows - Filesystems Zabbix agent By Valcann/vfs.fs.size[{#FSNAME},used]))<5G or timeleft(/Windows - Filesystems Zabbix agent By Valcann/vfs.fs.size[{#FSNAME},pused],1h,100)<1d)
              name: '[P2] {$CLIENT} | EC2 | {HOST.NAME} | {$AMBIENTE} | {#FSNAME}: DISK SPACE IS CRITICALLY LOW  (used > {$VFS.FS.PUSED.MAX.CRIT:"{#FSNAME}"}%)'
              opdata: 'Space used: {ITEM.LASTVALUE3} of {ITEM.LASTVALUE2} ({ITEM.LASTVALUE1})'
              status: DISABLED
              discover: NO_DISCOVER
              priority: AVERAGE
              description: |
                Two conditions should match: First, space utilization should be above {$VFS.FS.PUSED.MAX.CRIT:"{#FSNAME}"}.
                 Second condition should be one of the following:
                 - The disk free space is less than 5G.
                 - The disk will be full in less than 24 hours.
              manual_close: 'YES'
              tags:
                - tag: customer
                  value: '{$CLIENT}'
                - tag: Indicators
                  value: Operational
            - uuid: 6dd94f40d7164aae876de81f93943188
              expression: |
                last(/Windows - Filesystems Zabbix agent By Valcann/vfs.fs.size[{#FSNAME},pused])>{$VFS.FS.PUSED.MAX.WARN:"{#FSNAME}"} and
                ((last(/Windows - Filesystems Zabbix agent By Valcann/vfs.fs.size[{#FSNAME},total])-last(/Windows - Filesystems Zabbix agent By Valcann/vfs.fs.size[{#FSNAME},used]))<10G or timeleft(/Windows - Filesystems Zabbix agent By Valcann/vfs.fs.size[{#FSNAME},pused],1h,100)<1d)
              name: '[P3] {$CLIENT} | EC2 | {HOST.NAME} | {$AMBIENTE} | {#FSNAME}: DISK SPACE IS LOW (used > {$VFS.FS.PUSED.MAX.WARN:"{#FSNAME}"}%)'
              opdata: 'Space used: {ITEM.LASTVALUE3} of {ITEM.LASTVALUE2} ({ITEM.LASTVALUE1})'
              status: DISABLED
              discover: NO_DISCOVER
              priority: WARNING
              description: |
                Two conditions should match: First, space utilization should be above {$VFS.FS.PUSED.MAX.WARN:"{#FSNAME}"}.
                 Second condition should be one of the following:
                 - The disk free space is less than 10G.
                 - The disk will be full in less than 24 hours.
              manual_close: 'YES'
              dependencies:
                - name: '[P2] {$CLIENT} | EC2 | {HOST.NAME} | {$AMBIENTE} | {#FSNAME}: DISK SPACE IS CRITICALLY LOW  (used > {$VFS.FS.PUSED.MAX.CRIT:"{#FSNAME}"}%)'
                  expression: |
                    last(/Windows - Filesystems Zabbix agent By Valcann/vfs.fs.size[{#FSNAME},pused])>{$VFS.FS.PUSED.MAX.CRIT:"{#FSNAME}"} and
                    ((last(/Windows - Filesystems Zabbix agent By Valcann/vfs.fs.size[{#FSNAME},total])-last(/Windows - Filesystems Zabbix agent By Valcann/vfs.fs.size[{#FSNAME},used]))<5G or timeleft(/Windows - Filesystems Zabbix agent By Valcann/vfs.fs.size[{#FSNAME},pused],1h,100)<1d)
              tags:
                - tag: customer
                  value: '{$CLIENT}'
                - tag: Indicators
                  value: Operational
          graph_prototypes:
            - uuid: 30ca448d95d1495eaab3cc4eb9f26ed7
              name: '{#FSNAME}: Disk space usage'
              width: '600'
              height: '340'
              type: PIE
              show_3d: 'YES'
              graph_items:
                - color: '969696'
                  calc_fnc: LAST
                  type: GRAPH_SUM
                  item:
                    host: 'Windows - Filesystems Zabbix agent By Valcann'
                    key: 'vfs.fs.size[{#FSNAME},total]'
                - sortorder: '1'
                  color: C80000
                  calc_fnc: LAST
                  item:
                    host: 'Windows - Filesystems Zabbix agent By Valcann'
                    key: 'vfs.fs.size[{#FSNAME},used]'
      tags:
        - tag: component
          value: filesystem
        - tag: custom
          value: valcann
        - tag: customer
          value: '{$CLIENT}'
        - tag: os
          value: windows
        - tag: tier
          value: production
      macros:
        - macro: '{$FS.PUSED.CRIT.P1}'
          value: '99'
          description: 'Disco ≥ 99%'
        - macro: '{$FS.PUSED.CRIT.P2}'
          value: '95'
          description: 'Disco ≥ 95%'
        - macro: '{$FS.PUSED.CRIT.P3}'
          value: '90'
          description: 'Disco ≥ 90%'
        - macro: '{$VFS.FS.FSDRIVETYPE.MATCHES}'
          value: fixed
          description: 'This macro is used in filesystems discovery. Can be overridden on the host or linked template level.'
        - macro: '{$VFS.FS.FSDRIVETYPE.NOT_MATCHES}'
          value: ^\s$
          description: 'This macro is used in filesystems discovery. Can be overridden on the host or linked template level.'
        - macro: '{$VFS.FS.FSNAME.MATCHES}'
          value: '.*'
          description: 'This macro is used in filesystems discovery. Can be overridden on the host or linked template level.'
        - macro: '{$VFS.FS.FSNAME.NOT_MATCHES}'
          value: ^(/dev|/sys|/run|/proc|.+/shm$)
          description: 'This macro is used in filesystems discovery. Can be overridden on the host or linked template level.'
        - macro: '{$VFS.FS.FSTYPE.MATCHES}'
          value: '.*'
          description: 'This macro is used in filesystems discovery. Can be overridden on the host or linked template level.'
        - macro: '{$VFS.FS.FSTYPE.NOT_MATCHES}'
          value: ^\s$
          description: 'This macro is used in filesystems discovery. Can be overridden on the host or linked template level.'
        - macro: '{$VFS.FS.PUSED.MAX.CRIT}'
          value: '90'
          description: 'The critical threshold of the filesystem utilization in percent.'
        - macro: '{$VFS.FS.PUSED.MAX.WARN}'
          value: '80'
          description: 'The warning threshold of the filesystem utilization in percent.'
      dashboards:
        - uuid: 461b646bcac14c2b84c3b3097a5a56b8
          name: Filesystems
          pages:
            - name: Overview
              widgets:
                - type: graphprototype
                  width: '72'
                  height: '5'
                  fields:
                    - type: INTEGER
                      name: columns
                      value: '1'
                    - type: GRAPH_PROTOTYPE
                      name: graphid
                      value:
                        host: 'Windows - Filesystems Zabbix agent By Valcann'
                        name: '{#FSNAME}: Disk space usage'
                    - type: STRING
                      name: reference
                      value: AAAAA
                    - type: INTEGER
                      name: rows
                      value: '1'
