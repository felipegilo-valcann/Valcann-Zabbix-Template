zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 87aee4cb0e1343ccba619ab094961b8d
      name: Production
    - uuid: 139f5516036449dfb4937993b38c8e6e
      name: Template/Valcann
    - uuid: 57b7ae836ca64446ba2c296389c009b7
      name: Templates/Modules
    - uuid: 5eaaad360f814208b4123886b87455e2
      name: Valcann
    - uuid: e6038d56379f469a8610699f874881f7
      name: Windows
  templates:
    - uuid: 274892f5eff94908adc29f33aa513f78
      template: 'Windows - Memory Zabbix agent By Valcann'
      name: 'Windows - Memory Zabbix agent By Valcann'
      description: |
        Template tooling version used: 0.38
        
        By Valcann
      groups:
        - name: Production
        - name: Template/Valcann
        - name: Templates/Modules
        - name: Valcann
        - name: Windows
      items:
        - uuid: 5e1d47b2d66343c7874390d73c29a858
          name: 'Cache bytes'
          key: 'perf_counter_en["\Memory\Cache Bytes"]'
          history: 7d
          units: B
          description: |
            Cache Bytes is the sum of the Memory\\System Cache Resident Bytes, Memory\\System Driver Resident Bytes, 
            Memory\\System Code Resident Bytes, and Memory\\Pool Paged Resident Bytes counters. This counter displays 
            the last observed value only; it is not an average.
          tags:
            - tag: Application
              value: Memory
        - uuid: a19b1439385b4a0a98a6a600079c8c4e
          name: 'Free system page table entries'
          key: 'perf_counter_en["\Memory\Free System Page Table Entries"]'
          history: 7d
          description: |
            This indicates the number of page table entries not currently in use by the system. If the number is less 
            than 5,000, there may well be a memory leak or you running out of memory.
          tags:
            - tag: Application
              value: Memory
          triggers:
            - uuid: 3e737d35247e4913801323ef3621a47b
              expression: 'max(/Windows - Memory Zabbix agent By Valcann/perf_counter_en["\Memory\Free System Page Table Entries"],5m)<{$MEM.PAGE_TABLE_CRIT.MIN}'
              name: '[P3] {$CLIENT} | EC2 | {HOST.NAME} | {$AMBIENTE} | NUMBER OF FREE SYSTEM PAGE TABLE ENTRIES IS TOO LOW (less {$MEM.PAGE_TABLE_CRIT.MIN} for 5m)'
              priority: WARNING
              description: 'The Memory Free System Page Table Entries is less than {$MEM.PAGE_TABLE_CRIT.MIN} for 5 minutes. If the number is less than 5,000, there may well be a memory leak.'
        - uuid: 0249419163f441ea9c25a24a02c99bf3
          name: 'Memory page faults per second'
          key: 'perf_counter_en["\Memory\Page Faults/sec"]'
          history: 7d
          value_type: FLOAT
          description: |
            Page Faults/sec is the average number of pages faulted per second. It is measured in number of pages 
            faulted per second because only one page is faulted in each fault operation, hence this is also equal 
            to the number of page fault operations. This counter includes both hard faults (those that require 
            disk access) and soft faults (where the faulted page is found elsewhere in physical memory.) Most 
            processors can handle large numbers of soft faults without significant consequence. However, hard faults, 
            which require disk access, can cause significant delays.
          tags:
            - tag: Application
              value: Memory
        - uuid: 6402bfec59f342979b22646061d7e5b8
          name: 'Memory pages per second'
          key: 'perf_counter_en["\Memory\Pages/sec"]'
          history: 7d
          value_type: FLOAT
          description: |
            This measures the rate at which pages are read from or written to disk to resolve hard page faults. 
            If the value is greater than 1,000, as a result of excessive paging, there may be a memory leak.
          tags:
            - tag: Application
              value: Memory
          triggers:
            - uuid: 53e4180e1948451ab6e56352dc2639fa
              expression: 'min(/Windows - Memory Zabbix agent By Valcann/perf_counter_en["\Memory\Pages/sec"],5m)>{$MEM.PAGE_SEC.CRIT.MAX}'
              name: '[P3] {$CLIENT} | EC2 | {HOST.NAME} | {$AMBIENTE} | THE MEMORY PAGES/SEC IS TOO HIGH (over {$MEM.PAGE_SEC.CRIT.MAX} for 5m)'
              priority: WARNING
              description: 'The Memory Pages/sec in the last 5 minutes exceeds {$MEM.PAGE_SEC.CRIT.MAX}. If the value is greater than 1,000, as a result of excessive paging, there may be a memory leak.'
        - uuid: 800565fa5a1f45bb94556e17051f4b94
          name: 'Memory pool non-paged'
          key: 'perf_counter_en["\Memory\Pool Nonpaged Bytes"]'
          history: 7d
          units: B
          description: |
            This measures the size, in bytes, of the non-paged pool. This is an area of system memory for objects 
            that cannot be written to disk but instead must remain in physical memory as long as they are allocated. 
            There is a possible memory leak if the value is greater than 175MB (or 100MB with the /3GB switch). 
            A typical Event ID 2019 is recorded in the system event log.
          tags:
            - tag: Application
              value: Memory
        - uuid: 37a1c83ee7ed4e94998fb52815700b8f
          name: 'Used swap space in %'
          key: 'perf_counter_en["\Paging file(_Total)\% Usage"]'
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'The used space of swap volume/file in percent.'
          tags:
            - tag: Application
              value: Memory
        - uuid: 078fe933c114499b9ed395dadd7de1f9
          name: 'Free swap space'
          type: CALCULATED
          key: system.swap.free
          history: 7d
          units: B
          params: 'last(//system.swap.size[,total]) - last(//system.swap.size[,total]) / 100 * last(//perf_counter_en["\Paging file(_Total)\% Usage"])'
          description: 'The free space of swap volume/file in bytes.'
          tags:
            - tag: Application
              value: Memory
        - uuid: 60548e8bef5946378203da5dd04e5560
          name: 'Free swap space in %'
          type: DEPENDENT
          key: system.swap.pfree
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'The free space of swap volume/file in percent.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return (100 - value)'
          master_item:
            key: 'perf_counter_en["\Paging file(_Total)\% Usage"]'
          tags:
            - tag: Application
              value: Memory
        - uuid: 4eb13a43dc29412a9c04c8b74b286088
          name: 'Free swap space'
          key: 'system.swap.size[,free]'
          history: 7d
          units: B
          description: 'The free space of swap volume/file in bytes.'
          tags:
            - tag: Application
              value: Memory
        - uuid: 67cead2811924561a4f032df142214c2
          name: 'Free swap space in %'
          key: 'system.swap.size[,pfree]'
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'The free space of swap volume/file in percent.'
          tags:
            - tag: Application
              value: Memory
        - uuid: 1b97b083a52343209ba0148830150fc8
          name: 'Total swap space'
          key: 'system.swap.size[,total]'
          history: 7d
          units: B
          description: 'The total space of swap volume/file in bytes.'
          tags:
            - tag: Application
              value: Memory
        - uuid: a809407ea7434927a7e6464fd2102d0e
          name: 'Total memory'
          key: 'vm.memory.size[total]'
          history: 7d
          units: B
          description: 'Total memory in Bytes'
          tags:
            - tag: Application
              value: Memory
        - uuid: 4baad3d752e544e3a0e0e549a083a0a7
          name: 'Used memory'
          key: 'vm.memory.size[used]'
          history: 7d
          units: B
          description: 'Used memory in Bytes'
          tags:
            - tag: Application
              value: Memory
        - uuid: 68d89072d4f74f55b05d61a09fa1b417
          name: 'Memory utilization'
          type: CALCULATED
          key: vm.memory.util
          history: 7d
          value_type: FLOAT
          units: '%'
          params: 'last(//vm.memory.size[used]) / last(//vm.memory.size[total]) * 100'
          description: 'Memory utilization in %'
          tags:
            - tag: Application
              value: Memory
          triggers:
            - uuid: 2739bf8640684a819810c60dbcbb6f90
              expression: 'min(/Windows - Memory Zabbix agent By Valcann/vm.memory.util,15m)>={$MEMORY.UTIL.MAX.P1}'
              name: '[P1] {$CLIENT} | EC2 | {HOST.NAME} | {$AMBIENTE} | MEMORY UTILIZATION ( >{$MEMORY.UTIL.MAX.P1}% for 15m)'
              priority: HIGH
              description: 'The system is running out of free memory.'
              tags:
                - tag: Indicators
                  value: performance
                - tag: Name
                  value: '{HOST.NAME}'
            - uuid: 70281f51925549b59958544f0e279c63
              expression: 'min(/Windows - Memory Zabbix agent By Valcann/vm.memory.util,15m)>={$MEMORY.UTIL.MAX.P2} and min(/Windows - Memory Zabbix agent By Valcann/vm.memory.util,15m)<{$MEMORY.UTIL.MAX.P1}'
              name: '[P2] {$CLIENT} | EC2 | {HOST.NAME} | {$AMBIENTE} | MEMORY UTILIZATION ( >{$MEMORY.UTIL.MAX.P2}% for 15m)'
              priority: AVERAGE
              description: 'The system is running out of free memory.'
              tags:
                - tag: Indicators
                  value: performance
                - tag: Name
                  value: '{HOST.NAME}'
            - uuid: 2a7ac320dab14acaa6246909a6d2d3b0
              expression: 'min(/Windows - Memory Zabbix agent By Valcann/vm.memory.util,15m)>={$MEMORY.UTIL.MAX.P3} and min(/Windows - Memory Zabbix agent By Valcann/vm.memory.util,15m)<{$MEMORY.UTIL.MAX.P2}'
              name: '[P3] {$CLIENT} | EC2 | {HOST.NAME} | {$AMBIENTE} | MEMORY UTILIZATION ( >{$MEMORY.UTIL.MAX.P3}% for 15m)'
              priority: WARNING
              description: 'The system is running out of free memory.'
              tags:
                - tag: Indicators
                  value: performance
                - tag: Name
                  value: '{HOST.NAME}'
      tags:
        - tag: component
          value: memory
        - tag: custom
          value: valcann
        - tag: customer
          value: '{$CLIENT}'
        - tag: os
          value: windows
        - tag: tier
          value: production
      macros:
        - macro: '{$MEM.PAGE_SEC.CRIT.MAX}'
          value: '1000'
          description: 'The warning threshold of the Memory Pages/sec counter.'
        - macro: '{$MEM.PAGE_TABLE_CRIT.MIN}'
          value: '5000'
          description: 'The warning threshold of the Free System Page Table Entries counter.'
        - macro: '{$MEMORY.UTIL.MAX}'
          value: '90'
          description: 'The warning threshold of the Memory util item.'
        - macro: '{$MEMORY.UTIL.MAX.P1}'
          value: '99'
          description: 'The warning threshold of the Memory util item 95%'
        - macro: '{$MEMORY.UTIL.MAX.P2}'
          value: '95'
          description: 'The warning threshold of the Memory util item 90%'
        - macro: '{$MEMORY.UTIL.MAX.P3}'
          value: '90'
          description: 'The warning threshold of the Memory util item 90%'
        - macro: '{$SWAP.PFREE.MIN.WARN}'
          value: '20'
          description: 'The warning threshold of the minimum free swap.'
      dashboards:
        - uuid: e838063b430d4d018b40a71e628c314e
          name: Memory
          pages:
            - name: Overview
              widgets:
                - type: graph
                  width: '72'
                  height: '5'
                  fields:
                    - type: GRAPH
                      name: graphid
                      value:
                        host: 'Windows - Memory Zabbix agent By Valcann'
                        name: 'Memory utilization'
                    - type: STRING
                      name: reference
                      value: AAAAA
                - type: graph
                  'y': '5'
                  width: '72'
                  height: '5'
                  fields:
                    - type: GRAPH
                      name: graphid
                      value:
                        host: 'Windows - Memory Zabbix agent By Valcann'
                        name: 'Swap usage'
                    - type: STRING
                      name: reference
                      value: AAAAB
  triggers:
    - uuid: ceff07f0783e4a57b8c273b806fefa8a
      expression: 'max(/Windows - Memory Zabbix agent By Valcann/system.swap.pfree,5m)<{$SWAP.PFREE.MIN.WARN} and last(/Windows - Memory Zabbix agent By Valcann/system.swap.size[,total])>0'
      name: '[P3] {$CLIENT} | EC2 | {HOST.NAME} | {$AMBIENTE} | HIGH SWAP SPACE USAGE'
      opdata: 'Free: {ITEM.LASTVALUE1}, total: {ITEM.LASTVALUE2}'
      priority: WARNING
      description: 'This trigger is ignored, if there is no swap configured'
      tags:
        - tag: scope
          value: performance
  graphs:
    - uuid: 2ca2c29d41544564bcaf31e10c7b41db
      name: 'Memory utilization'
      ymin_type_1: FIXED
      ymax_type_1: FIXED
      graph_items:
        - drawtype: GRADIENT_LINE
          color: 1A7C11
          item:
            host: 'Windows - Memory Zabbix agent By Valcann'
            key: vm.memory.util
    - uuid: 79e3bd3d853d44d893d7fe082e1c4466
      name: 'Swap usage'
      graph_items:
        - color: 1A7C11
          item:
            host: 'Windows - Memory Zabbix agent By Valcann'
            key: system.swap.free
        - sortorder: '1'
          color: 2774A4
          item:
            host: 'Windows - Memory Zabbix agent By Valcann'
            key: 'system.swap.size[,total]'
