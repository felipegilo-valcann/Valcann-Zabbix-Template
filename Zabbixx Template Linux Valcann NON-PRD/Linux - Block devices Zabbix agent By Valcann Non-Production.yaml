zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 26ff66d075fa458191ad23b75aa88729
      name: Linux
    - uuid: bc208e27a97e44f7bfdede69b54ece77
      name: Non-Production
    - uuid: 05c84a0a453f4b44949ad9e9a614b173
      name: Template/Valcann
    - uuid: 57b7ae836ca64446ba2c296389c009b7
      name: Templates/Modules
    - uuid: fb0d0b63aabe4c4a83fb19a92cb34474
      name: Valcann
  templates:
    - uuid: 81f638419d384b13954abd0a8d2b8d81
      template: 'Linux - Block devices Zabbix agent By Valcann Non-Production'
      name: 'Linux - Block devices Zabbix agent By Valcann Non-Production'
      description: 'Template tooling version used: 0.38'
      groups:
        - name: Linux
        - name: Non-Production
        - name: Template/Valcann
        - name: Templates/Modules
        - name: Valcann
      discovery_rules:
        - uuid: 561a8dc4b17e4aa6943d09330339fc87
          name: 'Block devices discovery'
          key: vfs.dev.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#DEVNAME}'
                value: '{$VFS.DEV.DEVNAME.MATCHES}'
              - macro: '{#DEVNAME}'
                value: '{$VFS.DEV.DEVNAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#DEVTYPE}'
                value: disk
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: e97b5eda0bfc48d2b6f2d902ced6f7df
              name: '{#DEVNAME}: Disk average queue size (avgqu-sz)'
              type: DEPENDENT
              key: 'vfs.dev.queue_size[{#DEVNAME}]'
              history: 7d
              value_type: FLOAT
              description: 'Current average disk queue, the number of requests outstanding on the disk at the time the performance data is collected.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[10]'
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '0.001'
              master_item:
                key: 'vfs.file.contents[/sys/block/{#DEVNAME}/stat]'
              tags:
                - tag: Application
                  value: 'Disk {#DEVNAME}'
            - uuid: 66cdb570acf841e4b1b640fce3548471
              name: '{#DEVNAME}: Disk read request avg waiting time (r_await)'
              type: CALCULATED
              key: 'vfs.dev.read.await[{#DEVNAME}]'
              history: 7d
              value_type: FLOAT
              units: '!ms'
              params: '(last(//vfs.dev.read.time.rate[{#DEVNAME}])/(last(//vfs.dev.read.rate[{#DEVNAME}])+(last(//vfs.dev.read.rate[{#DEVNAME}])=0)))*1000*(last(//vfs.dev.read.rate[{#DEVNAME}]) > 0)'
              description: 'This formula contains two boolean expressions that evaluates to 1 or 0 in order to set calculated metric to zero and to avoid division by zero exception.'
              tags:
                - tag: Application
                  value: 'Disk {#DEVNAME}'
            - uuid: a50d4f3fc92e40809f9da93f571c2588
              name: '{#DEVNAME}: Disk read rate'
              type: DEPENDENT
              key: 'vfs.dev.read.rate[{#DEVNAME}]'
              history: 7d
              value_type: FLOAT
              units: '!r/s'
              description: 'r/s. The number (after merges) of read requests completed per second for the device.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[0]'
                - type: CHANGE_PER_SECOND
              master_item:
                key: 'vfs.file.contents[/sys/block/{#DEVNAME}/stat]'
              tags:
                - tag: Application
                  value: 'Disk {#DEVNAME}'
            - uuid: 33a324983367469f833593127c90bc0a
              name: '{#DEVNAME}: Disk read time (rate)'
              type: DEPENDENT
              key: 'vfs.dev.read.time.rate[{#DEVNAME}]'
              history: 7d
              value_type: FLOAT
              description: 'Rate of total read time counter. Used in r_await calculation'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[3]'
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '0.001'
              master_item:
                key: 'vfs.file.contents[/sys/block/{#DEVNAME}/stat]'
              tags:
                - tag: Application
                  value: 'Zabbix raw items'
            - uuid: 78f66b2b4ded430db77b5d8798e9fdca
              name: '{#DEVNAME}: Disk utilization'
              type: DEPENDENT
              key: 'vfs.dev.util[{#DEVNAME}]'
              history: 7d
              value_type: FLOAT
              units: '%'
              description: 'This item is the percentage of elapsed time that the selected disk drive was busy servicing read or writes requests.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[9]'
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '0.1'
              master_item:
                key: 'vfs.file.contents[/sys/block/{#DEVNAME}/stat]'
              tags:
                - tag: Application
                  value: 'Disk {#DEVNAME}'
            - uuid: f077f993971d4b54b9ff8a6ec7f9310b
              name: '{#DEVNAME}: Disk write request avg waiting time (w_await)'
              type: CALCULATED
              key: 'vfs.dev.write.await[{#DEVNAME}]'
              history: 7d
              value_type: FLOAT
              units: '!ms'
              params: '(last(//vfs.dev.write.time.rate[{#DEVNAME}])/(last(//vfs.dev.write.rate[{#DEVNAME}])+(last(//vfs.dev.write.rate[{#DEVNAME}])=0)))*1000*(last(//vfs.dev.write.rate[{#DEVNAME}]) > 0)'
              description: 'This formula contains two boolean expressions that evaluates to 1 or 0 in order to set calculated metric to zero and to avoid division by zero exception.'
              tags:
                - tag: Application
                  value: 'Disk {#DEVNAME}'
            - uuid: babe96ba0e084f9fbfe0539f1bda033f
              name: '{#DEVNAME}: Disk write rate'
              type: DEPENDENT
              key: 'vfs.dev.write.rate[{#DEVNAME}]'
              history: 7d
              value_type: FLOAT
              units: '!w/s'
              description: 'w/s. The number (after merges) of write requests completed per second for the device.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[4]'
                - type: CHANGE_PER_SECOND
              master_item:
                key: 'vfs.file.contents[/sys/block/{#DEVNAME}/stat]'
              tags:
                - tag: Application
                  value: 'Disk {#DEVNAME}'
            - uuid: 883df234db7448ce8e68e60b687a2365
              name: '{#DEVNAME}: Disk write time (rate)'
              type: DEPENDENT
              key: 'vfs.dev.write.time.rate[{#DEVNAME}]'
              history: 7d
              value_type: FLOAT
              description: 'Rate of total write time counter. Used in w_await calculation'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[7]'
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '0.001'
              master_item:
                key: 'vfs.file.contents[/sys/block/{#DEVNAME}/stat]'
              tags:
                - tag: Application
                  value: 'Zabbix raw items'
            - uuid: 7dac818fc1c8440d9303501945cfc36f
              name: '{#DEVNAME}: Get stats'
              key: 'vfs.file.contents[/sys/block/{#DEVNAME}/stat]'
              history: '0'
              value_type: TEXT
              description: 'Get contents of /sys/block/{#DEVNAME}/stat for disk stats.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - 'return JSON.stringify(value.trim().split(/ +/));'
              tags:
                - tag: Application
                  value: 'Zabbix raw items'
          trigger_prototypes:
            - uuid: 26422d30ff6945bf9785b443d519ff03
              expression: 'min(/Linux - Block devices Zabbix agent By Valcann Non-Production/vfs.dev.read.await[{#DEVNAME}],15m) > {$VFS.DEV.READ.AWAIT.WARN:"{#DEVNAME}"} or min(/Linux - Block devices Zabbix agent By Valcann Non-Production/vfs.dev.write.await[{#DEVNAME}],15m) > {$VFS.DEV.WRITE.AWAIT.WARN:"{#DEVNAME}"}'
              name: '[P3] {$CLIENT} | EC2 | {HOST.NAME} | {$AMBIENTE} | {#DEVNAME}: Disk read/write request responses are too high (read > {$VFS.DEV.READ.AWAIT.WARN:"{#DEVNAME}"} ms for 15m or write > {$VFS.DEV.WRITE.AWAIT.WARN:"{#DEVNAME}"} ms for 15m)'
              priority: WARNING
              description: 'This trigger might indicate disk {#DEVNAME} saturation.'
              manual_close: 'YES'
          graph_prototypes:
            - uuid: fc91ca00105b40fc94aaad5d3d605ded
              name: '{#DEVNAME}: Disk average waiting time'
              graph_items:
                - color: 1A7C11
                  item:
                    host: 'Linux - Block devices Zabbix agent By Valcann Non-Production'
                    key: 'vfs.dev.read.await[{#DEVNAME}]'
                - sortorder: '1'
                  drawtype: GRADIENT_LINE
                  color: 2774A4
                  item:
                    host: 'Linux - Block devices Zabbix agent By Valcann Non-Production'
                    key: 'vfs.dev.write.await[{#DEVNAME}]'
            - uuid: 65dbf24e9ff749a7999f806fbb149756
              name: '{#DEVNAME}: Disk read/write rates'
              graph_items:
                - color: 1A7C11
                  item:
                    host: 'Linux - Block devices Zabbix agent By Valcann Non-Production'
                    key: 'vfs.dev.read.rate[{#DEVNAME}]'
                - sortorder: '1'
                  drawtype: GRADIENT_LINE
                  color: 2774A4
                  item:
                    host: 'Linux - Block devices Zabbix agent By Valcann Non-Production'
                    key: 'vfs.dev.write.rate[{#DEVNAME}]'
            - uuid: 7dbdb9718e094ccc819cf3af9fbb0c75
              name: '{#DEVNAME}: Disk utilization and queue'
              graph_items:
                - color: 1A7C11
                  yaxisside: RIGHT
                  item:
                    host: 'Linux - Block devices Zabbix agent By Valcann Non-Production'
                    key: 'vfs.dev.queue_size[{#DEVNAME}]'
                - sortorder: '1'
                  drawtype: GRADIENT_LINE
                  color: 2774A4
                  item:
                    host: 'Linux - Block devices Zabbix agent By Valcann Non-Production'
                    key: 'vfs.dev.util[{#DEVNAME}]'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
      tags:
        - tag: component
          value: block-devices
        - tag: custom
          value: valcann
        - tag: os
          value: linux
        - tag: tier
          value: non-production
      macros:
        - macro: '{$VFS.DEV.DEVNAME.MATCHES}'
          value: .+
          description: 'This macro is used in block devices discovery. Can be overridden on the host or linked template level'
        - macro: '{$VFS.DEV.DEVNAME.NOT_MATCHES}'
          value: '^(loop[0-9]*|sd[a-z][0-9]+|nbd[0-9]+|sr[0-9]+|fd[0-9]+|dm-[0-9]+|ram[0-9]+|ploop[a-z0-9]+|md[0-9]*|hcp[0-9]*|zram[0-9]*)'
          description: 'This macro is used in block devices discovery. Can be overridden on the host or linked template level'
        - macro: '{$VFS.DEV.READ.AWAIT.WARN}'
          value: '20'
          description: 'Disk read average response time (in ms) before the trigger would fire'
        - macro: '{$VFS.DEV.WRITE.AWAIT.WARN}'
          value: '20'
          description: 'Disk write average response time (in ms) before the trigger would fire'
