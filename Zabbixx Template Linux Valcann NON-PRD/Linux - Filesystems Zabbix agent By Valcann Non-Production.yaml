zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 26ff66d075fa458191ad23b75aa88729
      name: Linux
    - uuid: bc208e27a97e44f7bfdede69b54ece77
      name: Non-Production
    - uuid: 05c84a0a453f4b44949ad9e9a614b173
      name: Template/Valcann
    - uuid: 57b7ae836ca64446ba2c296389c009b7
      name: Templates/Modules
    - uuid: fb0d0b63aabe4c4a83fb19a92cb34474
      name: Valcann
  templates:
    - uuid: 97610643fa154d16b53299b6d1a24917
      template: 'Linux - Filesystems Zabbix agent By Valcann Non-Production'
      name: 'Linux - Filesystems Zabbix agent By Valcann Non-Production'
      description: |
        Template tooling version used: 0.38
        
        By Valcann
      groups:
        - name: Linux
        - name: Non-Production
        - name: Template/Valcann
        - name: Templates/Modules
        - name: Valcann
      discovery_rules:
        - uuid: e8a223145ee0468683707f153c68c5c1
          name: 'Mounted filesystem discovery'
          key: vfs.fs.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#FSNAME}'
                value: '{$VFS.FS.FSNAME.MATCHES}'
              - macro: '{#FSNAME}'
                value: '{$VFS.FS.FSNAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#FSTYPE}'
                value: '{$VFS.FS.FSTYPE.MATCHES}'
              - macro: '{#FSTYPE}'
                value: '{$VFS.FS.FSTYPE.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Discovery of file systems of different types.'
          item_prototypes:
            - uuid: 1488a8dc721d4362851326eaac0a8dd2
              name: '{#FSNAME}: Free inodes in %'
              key: 'vfs.fs.inode[{#FSNAME},pfree]'
              history: 7d
              value_type: FLOAT
              units: '%'
              tags:
                - tag: Application
                  value: 'Filesystem {#FSNAME}'
              trigger_prototypes:
                - uuid: 35050db6e17847ad9e527131d34a6335
                  expression: 'min(/Linux - Filesystems Zabbix agent By Valcann Non-Production/vfs.fs.inode[{#FSNAME},pfree],5m)<{$VFS.FS.INODE.PFREE.MIN.CRIT:"{#FSNAME}"}'
                  name: '[P3] {$CLIENT} | EC2 | {HOST.NAME} | {$AMBIENTE} | {#FSNAME} Running out of free inodes (free < {$VFS.FS.INODE.PFREE.MIN.CRIT:"{#FSNAME}"}%)'
                  opdata: 'Free inodes: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: |
                    It may become impossible to write to disk if there are no index nodes left.
                    As symptoms, 'No space left on device' or 'Disk is full' errors may be seen even though free space is available.
                - uuid: 36ae539543444426a21a1f26b9794069
                  expression: 'min(/Linux - Filesystems Zabbix agent By Valcann Non-Production/vfs.fs.inode[{#FSNAME},pfree],5m)<{$VFS.FS.INODE.PFREE.MIN.WARN:"{#FSNAME}"}'
                  name: '[P3] {$CLIENT} | EC2 | {HOST.NAME} | {$AMBIENTE} | {#FSNAME} Running out of free inodes (free < {$VFS.FS.INODE.PFREE.MIN.WARN:"{#FSNAME}"}%)'
                  opdata: 'Free inodes: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: |
                    It may become impossible to write to disk if there are no index nodes left.
                    As symptoms, 'No space left on device' or 'Disk is full' errors may be seen even though free space is available.
                  dependencies:
                    - name: '[P3] {$CLIENT} | EC2 | {HOST.NAME} | {$AMBIENTE} | {#FSNAME} Running out of free inodes (free < {$VFS.FS.INODE.PFREE.MIN.CRIT:"{#FSNAME}"}%)'
                      expression: 'min(/Linux - Filesystems Zabbix agent By Valcann Non-Production/vfs.fs.inode[{#FSNAME},pfree],5m)<{$VFS.FS.INODE.PFREE.MIN.CRIT:"{#FSNAME}"}'
            - uuid: 82576bd1f0aa4cd8aad48e4e422419b2
              name: '{#FSNAME}: Space utilization'
              key: 'vfs.fs.size[{#FSNAME},pused]'
              history: 7d
              value_type: FLOAT
              units: '%'
              description: 'Space utilization in % for {#FSNAME}'
              tags:
                - tag: Application
                  value: 'Filesystem {#FSNAME}'
              trigger_prototypes:
                - uuid: ec3f8c0755d74e3eb144dc439cf3641a
                  expression: 'last(/Linux - Filesystems Zabbix agent By Valcann Non-Production/vfs.fs.size[{#FSNAME},pused])>={$FS.PUSED.CRIT.P1}'
                  name: '[P1] {$CLIENT} | EC2 | {HOST.NAME} | {$AMBIENTE} | DISK {#FSNAME} USED 99%)'
                  opdata: 'Space used: {ITEM.LASTVALUE3} of {ITEM.LASTVALUE2} ({ITEM.LASTVALUE1})'
                  priority: HIGH
                  description: 'Disk space usage on {#FSNAME} has reached 99% or above. Only 1% of free space remaining.'
                  manual_close: 'YES'
                  tags:
                    - tag: customer
                      value: '{$CLIENT}'
                    - tag: Indicators
                      value: Operational
                - uuid: b4045f5805f84d36934d3ed26a187b2d
                  expression: 'last(/Linux - Filesystems Zabbix agent By Valcann Non-Production/vfs.fs.size[{#FSNAME},pused])>={$FS.PUSED.CRIT.P2} and last(/Linux - Filesystems Zabbix agent By Valcann Non-Production/vfs.fs.size[{#FSNAME},pused])<{$FS.PUSED.CRIT.P1}'
                  name: '[P2] {$CLIENT} | EC2 | {HOST.NAME} | {$AMBIENTE} | DISK {#FSNAME} USED 95%)'
                  opdata: 'Space used: {ITEM.LASTVALUE3} of {ITEM.LASTVALUE2} ({ITEM.LASTVALUE1})'
                  priority: AVERAGE
                  description: 'Disk space usage on {#FSNAME} has reached 95% or above. Only 5% of free space remaining.'
                  manual_close: 'YES'
                  tags:
                    - tag: customer
                      value: '{$CLIENT}'
                    - tag: Indicators
                      value: Operational
                - uuid: f61401bc613b4be99f884dd0c86a566c
                  expression: |
                    last(/Linux - Filesystems Zabbix agent By Valcann Non-Production/vfs.fs.size[{#FSNAME},pused])>={$FS.PUSED.CRIT.P3}
                    and last(/Linux - Filesystems Zabbix agent By Valcann Non-Production/vfs.fs.size[{#FSNAME},pused])<{$FS.PUSED.CRIT.P2}
                  name: '[P3] {$CLIENT} | EC2 | {HOST.NAME} | {$AMBIENTE} | DISK {#FSNAME} USED 90%)'
                  opdata: 'Space used: {ITEM.LASTVALUE3} of {ITEM.LASTVALUE2} ({ITEM.LASTVALUE1})'
                  priority: WARNING
                  description: 'Disk space usage on {#FSNAME} has reached 90% or above. Only 10% of free space remaining.'
                  manual_close: 'YES'
                  tags:
                    - tag: customer
                      value: '{$CLIENT}'
                    - tag: Indicators
                      value: Operational
            - uuid: 70f6c0125174488dbdfac186d5839270
              name: '{#FSNAME}: Total space'
              key: 'vfs.fs.size[{#FSNAME},total]'
              history: 7d
              units: B
              description: 'Total space in Bytes'
              tags:
                - tag: Application
                  value: 'Filesystem {#FSNAME}'
            - uuid: 45e00550a79c47f99b779fb5a2948022
              name: '{#FSNAME}: Used space'
              key: 'vfs.fs.size[{#FSNAME},used]'
              history: 7d
              units: B
              description: 'Used storage in Bytes'
              tags:
                - tag: Application
                  value: 'Filesystem {#FSNAME}'
          graph_prototypes:
            - uuid: fbe4a3497ad5415c81cb446a48b53943
              name: '{#FSNAME}: Disk space usage'
              width: '600'
              height: '340'
              type: PIE
              show_3d: 'YES'
              graph_items:
                - color: '969696'
                  calc_fnc: LAST
                  type: GRAPH_SUM
                  item:
                    host: 'Linux - Filesystems Zabbix agent By Valcann Non-Production'
                    key: 'vfs.fs.size[{#FSNAME},total]'
                - sortorder: '1'
                  color: C80000
                  calc_fnc: LAST
                  item:
                    host: 'Linux - Filesystems Zabbix agent By Valcann Non-Production'
                    key: 'vfs.fs.size[{#FSNAME},used]'
      tags:
        - tag: component
          value: filesystem
        - tag: custom
          value: valcann
        - tag: customer
          value: '{$CLIENT}'
        - tag: os
          value: linux
        - tag: tier
          value: non-production
      macros:
        - macro: '{$FS.PUSED.CRIT.P1}'
          value: '99'
          description: 'Disco ≥ 99%'
        - macro: '{$FS.PUSED.CRIT.P2}'
          value: '95'
          description: 'Disco ≥ 95%'
        - macro: '{$FS.PUSED.CRIT.P3}'
          value: '90'
          description: 'Disco ≥ 90%'
        - macro: '{$VFS.FS.FSNAME.MATCHES}'
          value: .+
          description: 'This macro is used in filesystems discovery. Can be overridden on the host or linked template level'
        - macro: '{$VFS.FS.FSNAME.NOT_MATCHES}'
          value: ^(/dev|/sys|/run|/proc|.+/shm$)
          description: 'This macro is used in filesystems discovery. Can be overridden on the host or linked template level'
        - macro: '{$VFS.FS.FSTYPE.MATCHES}'
          value: ^(btrfs|ext2|ext3|ext4|reiser|xfs|ffs|ufs|jfs|jfs2|vxfs|hfs|apfs|refs|ntfs|fat32|zfs)$
          description: 'This macro is used in filesystems discovery. Can be overridden on the host or linked template level'
        - macro: '{$VFS.FS.FSTYPE.NOT_MATCHES}'
          value: ^\s$
          description: 'This macro is used in filesystems discovery. Can be overridden on the host or linked template level'
        - macro: '{$VFS.FS.INODE.PFREE.MIN.CRIT}'
          value: '15'
        - macro: '{$VFS.FS.INODE.PFREE.MIN.WARN}'
          value: '20'
        - macro: '{$VFS.FS.PUSED.MAX.CRIT}'
          value: '90'
        - macro: '{$VFS.FS.PUSED.MAX.WARN}'
          value: '80'
      dashboards:
        - uuid: 7abecc6ab3004553aa67891fbb70fc43
          name: Filesystems
          pages:
            - name: Overview
              widgets:
                - type: graphprototype
                  width: '72'
                  height: '5'
                  fields:
                    - type: INTEGER
                      name: columns
                      value: '1'
                    - type: GRAPH_PROTOTYPE
                      name: graphid
                      value:
                        host: 'Linux - Filesystems Zabbix agent By Valcann Non-Production'
                        name: '{#FSNAME}: Disk space usage'
                    - type: STRING
                      name: reference
                      value: AAAAA
                    - type: INTEGER
                      name: rows
                      value: '1'
