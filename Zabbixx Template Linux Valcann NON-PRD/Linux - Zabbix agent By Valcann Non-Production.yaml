zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: bc208e27a97e44f7bfdede69b54ece77
      name: Non-Production
    - uuid: 05c84a0a453f4b44949ad9e9a614b173
      name: Template/Valcann
    - uuid: 57b7ae836ca64446ba2c296389c009b7
      name: Templates/Modules
    - uuid: fb0d0b63aabe4c4a83fb19a92cb34474
      name: Valcann
  templates:
    - uuid: 1abf532d489e4de6b1d4d7d32919b83b
      template: 'Linux - Zabbix agent By Valcann Non-Production'
      name: 'Linux - Zabbix agent By Valcann Non-Production'
      description: |
        Use this template for agents reachable from Zabbix server/proxy (passive mode).
        
        Template tooling version used: 0.38
        
        By Valcann
      groups:
        - name: Non-Production
        - name: Template/Valcann
        - name: Templates/Modules
        - name: Valcann
      items:
        - uuid: 31804b7830224d14a2370f0b596799dc
          name: 'Host name of Zabbix agent running'
          key: agent.hostname
          delay: 1h
          history: 7d
          value_type: CHAR
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: Application
              value: 'Monitoring agent'
        - uuid: b40060c903924a48aaed97ca6d38e1ab
          name: 'Zabbix agent ping'
          key: agent.ping
          history: 7d
          description: 'The agent always returns 1 for this item. It could be used in combination with nodata() for availability check.'
          valuemap:
            name: 'Zabbix agent ping status'
          tags:
            - tag: Application
              value: 'Monitoring agent'
        - uuid: 985c0923b6764ec8b3cbd954a84c44cc
          name: 'Version of Zabbix agent running'
          key: agent.version
          delay: 1h
          history: 7d
          value_type: CHAR
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: Application
              value: 'Monitoring agent'
        - uuid: 29c6e53afa73427ca8b29d674452359f
          name: 'Zabbix agent availability'
          type: INTERNAL
          key: 'zabbix[host,agent,available]'
          history: 7d
          description: 'Monitoring agent availability status'
          valuemap:
            name: zabbix.host.available
          tags:
            - tag: Application
              value: Status
            - tag: Inventory
              value: 'Yes'
          triggers:
            - uuid: 9e8fb909706a4fc1a96ba01604591aec
              expression: 'max(/Linux - Zabbix agent By Valcann Non-Production/zabbix[host,agent,available],{$AGENT.TIMEOUT})=0'
              name: '[P2] {$CLIENT} | EC2 | {HOST.NAME} | {$AMBIENTE} | STATUS-CHECK (FOR {$AGENT.TIMEOUT})'
              priority: AVERAGE
              description: 'For passive only agents, host availability is used with {$AGENT.TIMEOUT} as time threshold.'
              manual_close: 'YES'
              tags:
                - tag: Host
                  value: '{HOST.NAME}'
                - tag: Indicators
                  value: Operational
      tags:
        - tag: component
          value: agent
        - tag: custom
          value: valcann
        - tag: customer
          value: '{$CLIENT}'
        - tag: os
          value: linux
        - tag: tier
          value: non-production
      macros:
        - macro: '{$AGENT.TIMEOUT}'
          value: 10m
          description: 'Timeout after which agent is considered unavailable. Works only for agents reachable from Zabbix server/proxy (passive mode).'
      dashboards:
        - uuid: 797946d484a44aab9a418629d40bf24d
          name: 'Zabbix agent: Overview'
          pages:
            - name: Main
              widgets:
                - type: item
                  name: 'Agent availability'
                  width: '18'
                  height: '3'
                  fields:
                    - type: ITEM
                      name: itemid
                      value:
                        host: 'Linux - Zabbix agent By Valcann Non-Production'
                        key: agent.ping
                    - type: INTEGER
                      name: show
                      value: '2'
                    - type: INTEGER
                      name: show
                      value: '4'
                - type: item
                  name: Version
                  x: '18'
                  width: '18'
                  height: '3'
                  fields:
                    - type: ITEM
                      name: itemid
                      value:
                        host: 'Linux - Zabbix agent By Valcann Non-Production'
                        key: agent.version
                    - type: INTEGER
                      name: show
                      value: '2'
                    - type: INTEGER
                      name: show
                      value: '4'
                - type: graph
                  x: '36'
                  width: '36'
                  height: '5'
                  fields:
                    - type: ITEM
                      name: itemid
                      value:
                        host: 'Linux - Zabbix agent By Valcann Non-Production'
                        key: agent.ping
                    - type: STRING
                      name: reference
                      value: AAAAA
                    - type: INTEGER
                      name: source_type
                      value: '1'
      valuemaps:
        - uuid: 72d8ccddc24a48e6a5c293135d7c50f8
          name: zabbix.host.available
          mappings:
            - value: '0'
              newvalue: 'not available'
            - value: '1'
              newvalue: available
            - value: '2'
              newvalue: unknown
        - uuid: 869071a110534340830ffc842ba5a11b
          name: 'Zabbix agent ping status'
          mappings:
            - value: '1'
              newvalue: Up
