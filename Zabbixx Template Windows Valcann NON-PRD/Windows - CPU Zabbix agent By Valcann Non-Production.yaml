zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: bc208e27a97e44f7bfdede69b54ece77
      name: Non-Production
    - uuid: 139f5516036449dfb4937993b38c8e6e
      name: Template/Valcann
    - uuid: 57b7ae836ca64446ba2c296389c009b7
      name: Templates/Modules
    - uuid: 5eaaad360f814208b4123886b87455e2
      name: Valcann
    - uuid: e6038d56379f469a8610699f874881f7
      name: Windows
  templates:
    - uuid: a383af5da32843658e33aecdeb9407ac
      template: 'Windows - CPU Zabbix agent By Valcann Non-Production'
      name: 'Windows - CPU Zabbix agent By Valcann Non-Production'
      description: |
        Template tooling version used: 0.38
        
        By Valcann
      groups:
        - name: Non-Production
        - name: Template/Valcann
        - name: Templates/Modules
        - name: Valcann
        - name: Windows
      items:
        - uuid: 816622e8b00b4350bc468e4258bf5307
          name: 'CPU Idle'
          key: 'perf_counter[\Processor(_Total)\% Idle Time]'
          history: 7d
          value_type: FLOAT
          units: '%'
          description: |
            Processor DPC time is the time that a single processor spent receiving and servicing deferred procedure 
            calls (DPCs). DPCs are interrupts that run at a lower priority than standard interrupts. % DPC Time is a 
            component of % Privileged Time because DPCs are executed in privileged mode. If a high % DPC Time is 
            sustained, there may be a processor bottleneck or an application or hardware related issue that can 
            significantly diminish overall system performance.
          tags:
            - tag: Application
              value: CPU
        - uuid: 570887d5592049f79d69d607194445f0
          name: 'CPU DPC time'
          key: 'perf_counter_en["\Processor Information(_total)\% DPC Time"]'
          history: 7d
          value_type: FLOAT
          units: '%'
          description: |
            Processor DPC time is the time that a single processor spent receiving and servicing deferred procedure 
            calls (DPCs). DPCs are interrupts that run at a lower priority than standard interrupts. % DPC Time is a 
            component of % Privileged Time because DPCs are executed in privileged mode. If a high % DPC Time is 
            sustained, there may be a processor bottleneck or an application or hardware related issue that can 
            significantly diminish overall system performance.
          tags:
            - tag: Application
              value: CPU
        - uuid: bfd2c4fe8ce5402aa430ff29cb9d5d91
          name: 'CPU interrupt time'
          key: 'perf_counter_en["\Processor Information(_total)\% Interrupt Time"]'
          history: 7d
          value_type: FLOAT
          units: '%'
          description: |
            The Processor Information\% Interrupt Time is the time the processor spends receiving and servicing 
            hardware interrupts during sample intervals. This value is an indirect indicator of the activity of 
            devices that generate interrupts, such as the system clock, the mouse, disk drivers, data communication 
            lines, network interface cards and other peripheral devices. This is an easy way to identify a potential 
            hardware failure. This should never be higher than 20%.
          tags:
            - tag: Application
              value: CPU
          triggers:
            - uuid: b7e7fda069ba457b93f04e6db8543610
              expression: 'min(/Windows - CPU Zabbix agent By Valcann Non-Production/perf_counter_en["\Processor Information(_total)\% Interrupt Time"],10m)>{$CPU.INTERRUPT.CRIT.MAX}'
              name: '[P3] {$CLIENT} | EC2 | {HOST.NAME} | {$AMBIENTE} | CPU INTERRUPT TIME IS TOO HIGH (over {$CPU.INTERRUPT.CRIT.MAX}% for 10m)'
              status: DISABLED
              priority: WARNING
              description: |
                "The CPU Interrupt Time in the last 5 minutes exceeds {$CPU.INTERRUPT.CRIT.MAX}%."
                The Processor Information\% Interrupt Time is the time the processor spends receiving and servicing 
                hardware interrupts during sample intervals. This value is an indirect indicator of the activity of 
                devices that generate interrupts, such as the system clock, the mouse, disk drivers, data communication 
                lines, network interface cards and other peripheral devices. This is an easy way to identify a potential 
                hardware failure. This should never be higher than 20%.
        - uuid: 091fff8c25e34acfb8c790f1c61c612e
          name: 'CPU privileged time'
          key: 'perf_counter_en["\Processor Information(_total)\% Privileged Time"]'
          history: 7d
          value_type: FLOAT
          units: '%'
          description: |
            The Processor Information\% Privileged Time counter shows the percent of time that the processor is spent 
            executing in Kernel (or Privileged) mode. Privileged mode includes services interrupts inside Interrupt 
            Service Routines (ISRs), executing Deferred Procedure Calls (DPCs), Device Driver calls and other kernel-mode 
            functions of the Windows® Operating System.
          tags:
            - tag: Application
              value: CPU
          triggers:
            - uuid: 7368eb4c783f4c03b6f9f2ea5fda1800
              expression: 'min(/Windows - CPU Zabbix agent By Valcann Non-Production/perf_counter_en["\Processor Information(_total)\% Privileged Time"],5m)>{$CPU.PRIV.CRIT.MAX}'
              name: '[P3] {$CLIENT} | EC2 | {HOST.NAME} | {$AMBIENTE} | CPU PRIVILEGED TIME IS TOO HIGH (over {$CPU.PRIV.CRIT.MAX}% for 5m)'
              status: DISABLED
              priority: WARNING
              description: 'The CPU privileged time in the last 5 minutes exceeds {$CPU.PRIV.CRIT.MAX}%.'
              dependencies:
                - name: '[P3] {$CLIENT} | EC2 | {HOST.NAME} | {$AMBIENTE} | CPU INTERRUPT TIME IS TOO HIGH (over {$CPU.INTERRUPT.CRIT.MAX}% for 10m)'
                  expression: 'min(/Windows - CPU Zabbix agent By Valcann Non-Production/perf_counter_en["\Processor Information(_total)\% Interrupt Time"],10m)>{$CPU.INTERRUPT.CRIT.MAX}'
        - uuid: 1177612519b947b6aa8b38a16756300c
          name: 'CPU user time'
          key: 'perf_counter_en["\Processor Information(_total)\% User Time"]'
          history: 7d
          value_type: FLOAT
          units: '%'
          description: |
            The Processor Information\% User Time counter shows the percent of time that the processor(s) is spent executing 
            in User mode.
          tags:
            - tag: Application
              value: CPU
        - uuid: 632c9368acc94bc4a97b3a2feadaa560
          name: 'Context switches per second'
          key: 'perf_counter_en["\System\Context Switches/sec"]'
          history: 7d
          value_type: FLOAT
          description: |
            Context Switches/sec is the combined rate at which all processors on the computer are switched from one thread to another.
            Context switches occur when a running thread voluntarily relinquishes the processor, is preempted by a higher priority ready thread, or switches between user-mode and privileged (kernel) mode to use an Executive or subsystem service.
            It is the sum of Thread\\Context Switches/sec for all threads running on all processors in the computer and is measured in numbers of switches.
            There are context switch counters on the System and Thread objects. This counter displays the difference between the values observed in the last two samples, divided by the duration of the sample interval.
          tags:
            - tag: Application
              value: CPU
        - uuid: 223bb6bcabd045b6a778725fa1aabdc3
          name: 'CPU queue length'
          key: 'perf_counter_en["\System\Processor Queue Length"]'
          history: 7d
          value_type: FLOAT
          description: |
            The Processor Queue Length shows the number of threads that are observed as delayed in the processor Ready Queue 
            and are waiting to be executed.
          tags:
            - tag: Application
              value: CPU
          triggers:
            - uuid: 07842594ea3442faad3c8cc545a16616
              expression: 'min(/Windows - CPU Zabbix agent By Valcann Non-Production/perf_counter_en["\System\Processor Queue Length"],5m)>{$CPU.QUEUE.CRIT.MAX}'
              name: '[P3] {$CLIENT} | EC2 | {HOST.NAME} | {$AMBIENTE} | CPU QUEUE LENGTH IS TOO HIGH (over {$CPU.QUEUE.CRIT.MAX} for 5m)'
              status: DISABLED
              priority: WARNING
              description: 'The CPU Queue Length in the last 5 minutes exceeds {$CPU.QUEUE.CRIT.MAX}.'
        - uuid: 43f3177fcc7140bdb6cf491985910499
          name: 'Processor load (1 min average)'
          key: 'system.cpu.load[percpu,avg1]'
          history: 90d
          value_type: FLOAT
          status: DISABLED
          tags:
            - tag: Application
              value: CPU
        - uuid: 25cd813c8d96450d8ba24ee94d8d88bc
          name: 'Processor load (5 min average)'
          key: 'system.cpu.load[percpu,avg5]'
          history: 90d
          value_type: FLOAT
          status: DISABLED
          tags:
            - tag: Application
              value: CPU
        - uuid: bb1984b5dcbb4c49bd2efd257730fdd6
          name: 'Processor load (15 min average)'
          key: 'system.cpu.load[percpu,avg15]'
          history: 90d
          value_type: FLOAT
          status: DISABLED
          tags:
            - tag: Application
              value: CPU
        - uuid: 2c41f053581a4a6284c3c63bf27e180b
          name: 'CPU utilization'
          key: system.cpu.util
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'CPU utilization in %'
          tags:
            - tag: Application
              value: CPU
          triggers:
            - uuid: 0497f08627af402db602ecff4de854f8
              expression: 'min(/Windows - CPU Zabbix agent By Valcann Non-Production/system.cpu.util,15m)>={$CPU.UTIL.CRIT.P1}'
              name: '[P1] {$CLIENT} | EC2 | {HOST.NAME} | {$AMBIENTE} | CPU UTILIZATION (over {$CPU.UTIL.CRIT.P1}% for 15m)'
              opdata: 'Current utilization: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'CPU utilization is too high. The system might be slow to respond.'
              tags:
                - tag: Indicators
                  value: Performance
                - tag: Name
                  value: '{HOST.NAME}'
            - uuid: c07d758366d049cf921837230fca4ad7
              expression: 'min(/Windows - CPU Zabbix agent By Valcann Non-Production/system.cpu.util,15m)>={$CPU.UTIL.CRIT.P2} and min(/Windows - CPU Zabbix agent By Valcann Non-Production/system.cpu.util,15m)<{$CPU.UTIL.CRIT.P1}'
              name: '[P2] {$CLIENT} | EC2 | {HOST.NAME} | {$AMBIENTE} | CPU UTILIZATION (over {$CPU.UTIL.CRIT.P2}% for 15m)'
              opdata: 'Current utilization: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'CPU utilization is too high. The system might be slow to respond.'
              tags:
                - tag: Indicators
                  value: Performance
                - tag: Name
                  value: '{HOST.NAME}'
            - uuid: 82c2be1c261d47c48c8b314c2d831e5d
              expression: 'min(/Windows - CPU Zabbix agent By Valcann Non-Production/system.cpu.util,15m)>={$CPU.UTIL.CRIT.P3} and min(/Windows - CPU Zabbix agent By Valcann Non-Production/system.cpu.util,15m)<{$CPU.UTIL.CRIT.P2}'
              name: '[P3] {$CLIENT} | EC2 | {HOST.NAME} | {$AMBIENTE} | CPU UTILIZATION (over {$CPU.UTIL.CRIT.P3}% for 15m)'
              opdata: 'Current utilization: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'CPU utilization is too high. The system might be slow to respond.'
              tags:
                - tag: Indicators
                  value: Performance
                - tag: Name
                  value: '{HOST.NAME}'
        - uuid: cf686994e5bc4316a675789029ebfbcf
          name: 'Number of cores'
          key: 'wmi.get[root/cimv2,"Select NumberOfLogicalProcessors from Win32_ComputerSystem"]'
          history: 7d
          description: 'The number of logical processors available on the computer.'
          tags:
            - tag: Application
              value: CPU
      tags:
        - tag: component
          value: cpu
        - tag: custom
          value: valcann
        - tag: customer
          value: '{$CLIENT}'
        - tag: os
          value: windows
        - tag: tier
          value: non-production
      macros:
        - macro: '{$CPU.INTERRUPT.CRIT.MAX}'
          value: '50'
          description: 'The critical threshold of the % Interrupt Time counter.'
        - macro: '{$CPU.PRIV.CRIT.MAX}'
          value: '30'
          description: 'The threshold of the % Privileged Time counter.'
        - macro: '{$CPU.QUEUE.CRIT.MAX}'
          value: '3'
          description: 'The threshold of the Processor Queue Length counter.'
        - macro: '{$CPU.UTIL.CRIT}'
          value: '90'
          description: 'The critical threshold of the CPU utilization in %.'
        - macro: '{$CPU.UTIL.CRIT.P1}'
          value: '99'
          description: 'The critical threshold of the CPU utilization in %'
        - macro: '{$CPU.UTIL.CRIT.P2}'
          value: '95'
          description: 'The critical threshold of the CPU utilization in %'
        - macro: '{$CPU.UTIL.CRIT.P3}'
          value: '90'
          description: 'The critical threshold of the CPU utilization in %'
      dashboards:
        - uuid: acc81120e4a34a2b9b52cdc9a0c63aeb
          name: CPU
          pages:
            - name: Overview
              widgets:
                - type: graph
                  width: '72'
                  height: '5'
                  fields:
                    - type: GRAPH
                      name: graphid
                      value:
                        host: 'Windows - CPU Zabbix agent By Valcann Non-Production'
                        name: 'CPU jumps'
                    - type: STRING
                      name: reference
                      value: AAAAA
                - type: graph
                  'y': '5'
                  width: '72'
                  height: '5'
                  fields:
                    - type: GRAPH
                      name: graphid
                      value:
                        host: 'Windows - CPU Zabbix agent By Valcann Non-Production'
                        name: 'CPU usage'
                    - type: STRING
                      name: reference
                      value: AAAAB
                - type: graph
                  'y': '10'
                  width: '72'
                  height: '5'
                  fields:
                    - type: GRAPH
                      name: graphid
                      value:
                        host: 'Windows - CPU Zabbix agent By Valcann Non-Production'
                        name: 'CPU utilization'
                    - type: STRING
                      name: reference
                      value: AAAAC
  triggers:
    - uuid: 32438970ceb945aea2fe1bbbc2a0fcde
      expression: 'min(/Windows - CPU Zabbix agent By Valcann Non-Production/perf_counter_en["\System\Processor Queue Length"],5m) - last(/Windows - CPU Zabbix agent By Valcann Non-Production/wmi.get[root/cimv2,"Select NumberOfLogicalProcessors from Win32_ComputerSystem"]) * 2 > {$CPU.QUEUE.CRIT.MAX}'
      name: '[P3] {$CLIENT} | EC2 | {HOST.NAME} | {$AMBIENTE} | CPU QUEUE LENGTH IS TOO HIGH (over {$CPU.QUEUE.CRIT.MAX} for 5m)'
      status: DISABLED
      priority: WARNING
      description: 'The CPU Queue Length in the last 5 minutes exceeds {$CPU.QUEUE.CRIT.MAX}. According to actual observations, PQL should not exceed the number of cores * 2. To fine-tune the conditions, use the macro {$CPU.QUEUE.CRIT.MAX }.'
  graphs:
    - uuid: 903a9f36ec744808ad556ff3c4654e34
      name: 'CPU jumps'
      graph_items:
        - color: 1A7C11
          item:
            host: 'Windows - CPU Zabbix agent By Valcann Non-Production'
            key: 'perf_counter_en["\System\Context Switches/sec"]'
        - sortorder: '1'
          color: 2774A4
          item:
            host: 'Windows - CPU Zabbix agent By Valcann Non-Production'
            key: 'perf_counter_en["\Processor Information(_total)\% Interrupt Time"]'
    - uuid: b5a1278b20b04cd883d184ebd006a795
      name: 'CPU usage'
      type: STACKED
      ymin_type_1: FIXED
      ymax_type_1: FIXED
      graph_items:
        - color: 1A7C11
          item:
            host: 'Windows - CPU Zabbix agent By Valcann Non-Production'
            key: 'perf_counter_en["\Processor Information(_total)\% User Time"]'
        - sortorder: '1'
          color: 2774A4
          item:
            host: 'Windows - CPU Zabbix agent By Valcann Non-Production'
            key: 'perf_counter_en["\Processor Information(_total)\% Privileged Time"]'
    - uuid: 4015af656a6b44be91998fa3f945c791
      name: 'CPU utilization'
      ymin_type_1: FIXED
      ymax_type_1: FIXED
      graph_items:
        - drawtype: GRADIENT_LINE
          color: 1A7C11
          item:
            host: 'Windows - CPU Zabbix agent By Valcann Non-Production'
            key: system.cpu.util
