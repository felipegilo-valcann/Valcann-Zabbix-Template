zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: bc208e27a97e44f7bfdede69b54ece77
      name: Non-Production
    - uuid: 139f5516036449dfb4937993b38c8e6e
      name: Template/Valcann
    - uuid: 57b7ae836ca64446ba2c296389c009b7
      name: Templates/Modules
    - uuid: 5eaaad360f814208b4123886b87455e2
      name: Valcann
  templates:
    - uuid: 1dc3e1b006244d78b24e7a005bf1c8ff
      template: 'Windows - Zabbix agent By Valcann Non-Production'
      name: 'Windows - Zabbix agent By Valcann Non-Production'
      description: |
        Use this template for agents reachable from Zabbix server/proxy (passive mode).
        
        Template tooling version used: 0.38
        
        By Valcann
      groups:
        - name: Non-Production
        - name: Template/Valcann
        - name: Templates/Modules
        - name: Valcann
      items:
        - uuid: cdd4aacfd62d4c70a5f644a5678bf5c6
          name: 'Host name of Zabbix agent running'
          key: agent.hostname
          delay: 1h
          history: 7d
          value_type: CHAR
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: Application
              value: 'Monitoring agent'
        - uuid: 7e2210b5f14749b59103b4d0a9f85f27
          name: 'Zabbix agent ping'
          key: agent.ping
          history: 7d
          description: 'The agent always returns 1 for this item. It could be used in combination with nodata() for availability check.'
          valuemap:
            name: 'Zabbix agent ping status'
          tags:
            - tag: Application
              value: 'Monitoring agent'
        - uuid: 86de2692c7f7490088d86d079a7d0cce
          name: 'Version of Zabbix agent running'
          key: agent.version
          delay: 1h
          history: 7d
          value_type: CHAR
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: Application
              value: 'Monitoring agent'
        - uuid: a55460c148a048fa8e7738f89ff3f025
          name: 'Zabbix agent availability'
          type: INTERNAL
          key: 'zabbix[host,agent,available]'
          history: 7d
          description: 'Monitoring agent availability status'
          valuemap:
            name: zabbix.host.available
          tags:
            - tag: Application
              value: Status
            - tag: Inventory
              value: 'Yes'
          triggers:
            - uuid: 7090e20d50e64d30948a7b271c17771c
              expression: 'max(/Windows - Zabbix agent By Valcann Non-Production/zabbix[host,agent,available],{$AGENT.TIMEOUT})=0'
              name: '[P2] {$CLIENT} | EC2 | {HOST.NAME} | {$AMBIENTE} | STATUS-CHECK (FOR {$AGENT.TIMEOUT})'
              priority: AVERAGE
              description: 'For passive only agents, host availability is used with {$AGENT.TIMEOUT} as time threshold.'
              manual_close: 'YES'
              tags:
                - tag: Host
                  value: '{HOST.NAME}'
                - tag: Indicators
                  value: Operational
      tags:
        - tag: component
          value: agent
        - tag: custom
          value: valcann
        - tag: customer
          value: '{$CLIENT}'
        - tag: os
          value: windows
        - tag: tier
          value: non-production
      macros:
        - macro: '{$AGENT.TIMEOUT}'
          value: 10m
          description: 'Timeout after which agent is considered unavailable. Works only for agents reachable from Zabbix server/proxy (passive mode).'
      dashboards:
        - uuid: ca53d5c170214667ab389b1e9fbf66c7
          name: 'Zabbix agent: Overview'
          pages:
            - name: Main
              widgets:
                - type: item
                  name: 'Agent availability'
                  width: '18'
                  height: '3'
                  fields:
                    - type: ITEM
                      name: itemid
                      value:
                        host: 'Windows - Zabbix agent By Valcann Non-Production'
                        key: agent.ping
                    - type: INTEGER
                      name: show
                      value: '2'
                    - type: INTEGER
                      name: show
                      value: '4'
                - type: item
                  name: Version
                  x: '18'
                  width: '18'
                  height: '3'
                  fields:
                    - type: ITEM
                      name: itemid
                      value:
                        host: 'Windows - Zabbix agent By Valcann Non-Production'
                        key: agent.version
                    - type: INTEGER
                      name: show
                      value: '2'
                    - type: INTEGER
                      name: show
                      value: '4'
                - type: graph
                  x: '36'
                  width: '36'
                  height: '5'
                  fields:
                    - type: ITEM
                      name: itemid
                      value:
                        host: 'Windows - Zabbix agent By Valcann Non-Production'
                        key: agent.ping
                    - type: STRING
                      name: reference
                      value: AAAAA
                    - type: INTEGER
                      name: source_type
                      value: '1'
      valuemaps:
        - uuid: 0152a521e2bf43e1b22039ac370fa71d
          name: zabbix.host.available
          mappings:
            - value: '0'
              newvalue: 'not available'
            - value: '1'
              newvalue: available
            - value: '2'
              newvalue: unknown
        - uuid: ffa2447d67f444d3aa6af92f1c3d88c8
          name: 'Zabbix agent ping status'
          mappings:
            - value: '1'
              newvalue: Up
